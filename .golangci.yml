version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aatuh/evydence

linters:
  default: none
  enable:
    # Baseline correctness.
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint

    # Error-handling and nil-path bugs.
    - errcheck
    - nilerr

    # Resource leaks.
    - bodyclose
    - rowserrcheck
    - sqlclosecheck

    # Security and hardening.
    - gosec
    - bidichk

    # Server/API context propagation.
    - noctx
    - contextcheck

    # Developer experience.
    - nolintlint
    - durationcheck
    - misspell

  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # Request.AddCookie sends only name/value; response attributes do not
      # travel in Cookie headers. Keep SetCookie alerts active in all files.
      # make lint-policy-check verifies both production and test responses.
      - path: _test\.go$
        linters:
          - gosec
        text: "G124:"
        source: '^\s*[A-Za-z_][A-Za-z_0-9]*\.AddCookie\(&http\.Cookie\{'
      - path: _test\.go
        linters:
          - gosec
        text: "G101|G204|G404"
      - path: _test\.go
        linters:
          - noctx
      - path: _test\.go
        linters:
          - errorlint
        text: "comparing with"
