services:
  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evydence}
      POSTGRES_USER: ${POSTGRES_USER:-evydence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-evydence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./deploy/local-dependencies
      target: minio
    image: evydence-local-minio:20251015-9e49d5e7a648
    pull_policy: build
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-evydence}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
