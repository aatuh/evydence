<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Evydence reviewer journey</title>
  <desc id="desc">Static journey through release summary, vulnerability decisions, evidence contents, verification, gaps, and limitations using non-sensitive sample package data.</desc>
  <rect width="980" height="520" fill="#f6f8fb"/>
  <rect x="32" y="28" width="916" height="464" rx="10" fill="#ffffff" stroke="#d9dee8"/>
  <text x="58" y="70" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Reviewer Journey</text>
  <text x="58" y="96" font-family="Inter, Arial, sans-serif" font-size="14" fill="#536173">Sample package, local viewer only, no upload</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7687"/>
    </marker>
  </defs>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="58" y="132" width="250" height="104" rx="8" fill="#edf5ff" stroke="#b8d3f5"/>
    <text x="78" y="162" font-size="16" font-weight="700" fill="#13253b">1. Release Summary</text>
    <text x="78" y="190" font-size="13" fill="#39475d">Product, release, package scope,</text>
    <text x="78" y="210" font-size="13" fill="#39475d">artifact digests, report result.</text>

    <rect x="365" y="132" width="250" height="104" rx="8" fill="#fff5e8" stroke="#e9c98d"/>
    <text x="385" y="162" font-size="16" font-weight="700" fill="#452e13">2. VEX Decisions</text>
    <text x="385" y="190" font-size="13" fill="#5a472d">Affected, fixed, not affected,</text>
    <text x="385" y="210" font-size="13" fill="#5a472d">approval and impact statements.</text>

    <rect x="672" y="132" width="250" height="104" rx="8" fill="#eefaf0" stroke="#bddfc4"/>
    <text x="692" y="162" font-size="16" font-weight="700" fill="#14351c">3. Evidence Contents</text>
    <text x="692" y="190" font-size="13" fill="#294534">SBOM, scan, VEX, bundle,</text>
    <text x="692" y="210" font-size="13" fill="#294534">approvals, redaction metadata.</text>

    <line x1="318" y1="184" x2="354" y2="184" stroke="#6b7687" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="625" y1="184" x2="661" y2="184" stroke="#6b7687" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="58" y="296" width="250" height="104" rx="8" fill="#f0f4ff" stroke="#c4cef4"/>
    <text x="78" y="326" font-size="16" font-weight="700" fill="#1e2b55">4. Verification Status</text>
    <text x="78" y="354" font-size="13" fill="#3f4a6b">Manifest hash, archive scope,</text>
    <text x="78" y="374" font-size="13" fill="#3f4a6b">bundle and audit-chain checks.</text>

    <rect x="365" y="296" width="250" height="104" rx="8" fill="#fff0f0" stroke="#efbaba"/>
    <text x="385" y="326" font-size="16" font-weight="700" fill="#681a1a">5. Gaps</text>
    <text x="385" y="354" font-size="13" fill="#6f3939">Missing evidence, stale items,</text>
    <text x="385" y="374" font-size="13" fill="#6f3939">unhandled findings, exceptions.</text>

    <rect x="672" y="296" width="250" height="104" rx="8" fill="#f8f8ee" stroke="#dad9aa"/>
    <text x="692" y="326" font-size="16" font-weight="700" fill="#45451a">6. Limitations</text>
    <text x="692" y="354" font-size="13" fill="#5d5d36">No legal compliance proof,</text>
    <text x="692" y="374" font-size="13" fill="#5d5d36">no complete SBOM proof.</text>

    <line x1="797" y1="246" x2="797" y2="274" stroke="#6b7687" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="672" y1="348" x2="626" y2="348" stroke="#6b7687" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="365" y1="348" x2="319" y2="348" stroke="#6b7687" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <rect x="58" y="432" width="864" height="34" rx="6" fill="#172033"/>
  <text x="78" y="454" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff">Input: examples/end-to-end-release-evidence/sample-customer-package-manifest.json</text>
</svg>
