es current tenant/selected-parent locks held through the outer replay transaction. Replay reads only ownership coordinates, not evidence payload/title metadata, the export snapshot, signing keys or providers; it allocates no bundle clocks/IDs and does not hash or sign again. A revoked signing key does not rewrite a historical bundle or turn replay into a current verification result. Fresh exports recheck selected coordinates and the signature against current signing-key lifecycle before atomically committing signature, bundle, caller audit and replay; export adds no worker job. Original request-byte identity, public DTOs/schema versions and normalized-JSON hash behavior remain unchanged. Both profiles require exact-case non-null JSON fields/items, raw NUL-free UTF-8 IDs of at most 1024 bytes, the existing 64 KiB body and JSON structural limits, and same-host HTTPS Origin for cookie mutations with Bearer precedence. Snapshot selections retain the 4096 combined evidence/proof-row and 8 MiB proof-metadata limits; unsupported saved selections fail closed. New durable times use UTC microseconds. Local memory explicitly checks the actual response selection before disclosure but remains nondurable, without database ownership transactions. Export does not prove evidence completeness, external key custody, release security or compliance.","operationId":"exportEvidenceBundle","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ExportEvidenceBundleRequest"}}},"description":"Evidence bundle export request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EvidenceBundleEnvelope"}}},"description":"Created evidence bundle envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Export evidence bundle","tags":["evydence"],"x-evydence-owner":"customer-delivery","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["bundle:read"]}},"/v1/evidence-bundles/import":{"post":{"description":"Validates the portable manifest hash, evidence-bundle.v1.0.0 version and normalized evidence-ID set, then records only a target-tenant import receipt and caller-attributed audit entry. Empty evidence selections are allowed; manifest IDs cannot repeat after trimming, while duplicate outer IDs retain set semantics. Source identities, timestamps and signature references are untrusted labels, not resource lookups or target authority. Human actors require current tenant-wide bundle:write permission. PostgreSQL uses native durable HTTP execution without Ledger cloning/replay/refresh; every retry rechecks target-tenant authority/existence without hashing the manifest or allocating receipt clocks/IDs. The shared writer fence precedes tenant locks held through receipt/audit/replay commit. Changed original bytes conflict; completed replay returns the original safe receipt. Both profiles enforce exact-case non-null fields/items and NUL-free UTF-8 outer labels; source IDs and reference text are bounded at 1024 raw bytes, manifest hashes at 128 bytes, outer evidence/signature lists at 1024 entries before normalization, and the encoded manifest at 64 KiB with the existing JSON structural limits. The HTTP body remains bounded at 64 KiB. Cookie writes require same-host HTTPS Origin with Bearer precedence. New durable timestamps use UTC microseconds. Existing normalized-JSON hashing, including its float64 numeric limitation, is unchanged. Local memory remains nondurable. An accepted receipt does not ingest evidence, verify signatures, establish provenance or prove security/compliance.","operationId":"importEvidenceBundle","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EvidenceBundle"}}},"description":"Evidence bundle import request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EvidenceBundleImportEnvelope"}}},"description":"Evidence bundle import result envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"