es":false,"description":"Strict JSON accepts only exact declared field names, without unknown/duplicate fields, case aliases, explicit null fields or null output items. Scalar text must be NUL-free UTF-8. Before trimming, project/release/output-artifact IDs are bounded at 1024 bytes, other text at 64 KiB, and output digests at 128 bytes. Provider metadata must be JSON-serializable, NUL-free in keys and string values, and at most 64 KiB encoded; outputs are limited to 4096. The whole HTTP body is capped at 64 KiB including syntax/escapes. Run attempts must be nonnegative; timestamps must be representable in years 1 through 9999 both as submitted and in UTC. Commit SHA is 40 hexadecimal characters; nonempty hashes and output digests use SHA-256. GitHub Actions requires repository, workflow_ref, run_id and positive run_attempt; GitLab CI requires repository and run_id. Invalid input returns 400 before ownership reads or writes. Submitted CI identity is unverified metadata.","properties":{"actor":{"type":"string"},"commit_sha":{"type":"string"},"environment_hash":{"type":"string"},"finished_at":{"format":"date-time","type":"string"},"job_id":{"type":"string"},"oidc_subject":{"type":"string"},"outputs":{"items":{"$ref":"#/components/schemas/BuildOutput"},"type":"array"},"parameters_hash":{"type":"string"},"project_id":{"type":"string"},"provider":{"type":"string"},"provider_metadata":{"type":"object"},"ref":{"type":"string"},"release_id":{"type":"string"},"repository":{"type":"string"},"run_attempt":{"minimum":0,"type":"integer"},"run_id":{"type":"string"},"started_at":{"format":"date-time","type":"string"},"status":{"enum":["queued","running","passed","failed","cancelled"],"type":"string"},"workflow_ref":{"type":"string"}},"required":["project_id","release_id","provider","commit_sha","status","started_at"],"type":"object"},"CreateCollectorRequest":{"additionalProperties":false,"properties":{"name":{"type":"string"},"scopes":{"items":{"type":"string"},"type":"array"},"ty