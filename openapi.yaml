on.","in":"query","name":"cursor","required":false,"schema":{"maxLength":4096,"minLength":1,"type":"string"}},{"description":"Sort direction for cursor pagination.","in":"query","name":"direction","required":false,"schema":{"default":"asc","enum":["asc","desc"],"type":"string"}},{"description":"Maximum records in this page. Defaults to 50 and is capped at 500.","in":"query","name":"page_size","required":false,"schema":{"default":50,"maximum":500,"minimum":1,"type":"integer"}},{"description":"Stable sort key for cursor pagination.","in":"query","name":"sort","required":false,"schema":{"default":"id","enum":["id"],"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ControlFrameworkTemplatePackListEnvelope"}}},"description":"Control framework template pack list envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"List control framework template packs","tags":["evydence"],"x-evydence-stability":"experimental","x-scopes":["controls:read"]}},"/v1/control-framework-template-packs/{slug}/install":{"post":{"description":"Installs a named starter pack as ordinary framework/control records. PostgreSQL uses a focused command and native durable replay: current tenant-level controls:admin grants for human sessions and tenant existence are checked before every fresh request or replay, without reading installed framework/control metadata. Fresh installation alone checks the tenant/slug/version key and atomically appends all starter controls, one principal audit and the replay result, without a background job or Ledger clone. Same-key replay returns the original framework; changed request bytes or a different-key duplicate tenant/slug/version return 409. The raw slug is NUL-free UTF-8 and bounded at 1024 bytes before trimming and durable replay reservation; invalid slugs return 400 and unknown slugs 404. An optional body must be an empty JSON object; blank/absent bodies retain their acceptance and exact byte fingerprints. Malformed, non-object, null, or unknown-field bodies return 400. Cookie-authenticated writes require same-host HTTPS Origin; explicit bearer authentication takes precedence. Local memory retains compatibility storage and nondurable replay with the same tenant administration and raw-slug bounds. Starter content organizes technical evidence, not framework compliance or control efficacy.","operationId":"installControlFrameworkTemplatePack","parameters":[{"description":"Control framework template pack slug; trimmed, NUL-free UTF-8, at most 1024 bytes.","in":"path","name":"slug","required":true,"schema":{"type":"string"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EmptyObject"}}},"description":"Optional empty JSON object; an absent or blank body uses an empty object.","required":false},"respo