cription":"New packages require current tenant-owned product/redaction-profile references and optional matching release. Raw NUL-free UTF-8 IDs are capped at 1024 bytes and title at 4096 bytes before trimming; required values must be nonblank. expires_at must be a representable UTC timestamp in the future, checked again after write locks. Requests retain the 64 KiB JSON body limit. Duplicate/case-aliased keys and explicit null fields are rejected, as are malformed/non-object JSON and unknown fields, in both runtime profiles. Cookie mutations require a same-host HTTPS Origin; bearer credentials retain precedence. Snapshot and final manifest are independently capped at 8 MiB, JSON depth 32 and 4096 entries per array. Historical package responses are not restricted by these creation bounds.","properties":{"expires_at":{"format":"date-time","type":"string"},"product_id":{"maxLength":1024,"minLength":1,"type":"string"},"redaction_profile_id":{"maxLength":1024,"minLength":1,"type":"string"},"release_id":{"maxLength":1024,"type":"string"},"title":{"maxLength":4096,"minLength":1,"type":"string"}},"required":["product_id","redaction_profile_id","title","expires_at"],"type":"object"},"CreateCustomerPortalAccessRequest":{"additionalProperties":false,"properties":{"customer_name":{"description":"Recipient label; at most 640 UTF-8 bytes before 160-rune/control-character normalization.","maxLength":640,"minLength":1,"type":"string"},"expires_at":{"format":"date-time","type":"string"},"package_id":{"description":"Current tenant-owned package ID; at most 1024 UTF-8 bytes.","maxLength":1024,"minLength":1,"type":"string"},"require_nda":{"type":"boolean"},"reviewer_email":{"description":"Optional external reviewer email label, lowercased; at most 640 UTF-8 bytes. It is not an authentication secret.","maxLength":640,"type":"string"},"reviewer_name":{"description":"Optional external reviewer display name; at most 640 UTF-8 bytes before label normalization.","maxLength":640,"type":"string"},"watermark":{"description":"Optional customer-visible distribution watermark; at most 640 UTF-8 bytes before label normalization. ZIP rendering rejects sensitive content, including email-shaped watermark text.","maxLength":640,"type":"string"}},"required":["package_id","customer_name","expires_at"],"type":"object"},"CreateDSSETrustRootRequest":{"additionalProperties":false,"description":"Records an operator-supplied public key and DSSE policy, not verified builder identity or provenance. PostgreSQL uses a focused durable command without Ledger replay, checks current tenant-wide keys:admin authority before reservation/replay, and holds the tenant mutation fence/root lock through metadata/audit/replay commit. Human sessions need a matching tenant grant. Raw NUL-free UTF-8 policy entries are capped at 4096 bytes each, with a combined 4096 entries and 1 MiB across all three lists before trimming and sorting. Each normalized list must be nonempty and contain no blank or duplicate values; accepted surrounding whitespace retains its existing normalization. The whole JSON body is capped at 64 KiB. Unknown, duplicate, case-aliased, explicitly null fields and null array items fail validation before command execution. Same-key replay returns the original record; changed request bytes conflict. Unsafe cookie-authenticated mutations require same-origin protection. Local memory retains its explicit nondurable compatibility binding.","properties":{"algorithm":{"enum":["Ed25519"],"maxLength":4096,"type":"string"},"allowed_predicate_types":{"items":{"enum":["https://slsa.dev/provenance/v1"],"maxLength":4096,"type":"string"},"maxItems":4096,"minItems":1,"type":"array","uniqueItems":true},"expected_builder_ids":{"items":{"maxLength":4096,"minLength":1,"type":"string"},"maxItems":4096,"minItems":1,"type":"array","uniqueItems":true},"key_id":{"description":"Nonblank tenant-local key ID; raw NUL-free UTF-8 is capped at 1024 bytes before trimming.","maxLength":1024,"minLength":1,"type":"string"},"name":{"description":"Nonblank name; raw NUL-free UTF-8 is capped at 4096 bytes before trimming.","maxLength":4096,"minLength":1,"type":"string"},"public_key":{"description":"Base64-encoded 32-byte Ed25519 public key; raw NUL-free UTF-8 is capped at 128 bytes before trimming.","maxLength":128,"type":"string"},"required_claims":{"items":{"enum":["builder_id","build_type","external_parameters"],"maxLength":4096,"type":"string"},"maxItems":4096,"minItems":1,"type":"array","uniqueItems":true}},"required":["name","key_id","algorithm","public_key","allowed_predicate_types","expected_builder_ids","required_claims"],"type":"object"},"CreateDeploymentEnvironmentRequest":{"additionalProperties":false,"properties":{"kind":{"type":"string"},"name":{"type":"string"},"product_id":{"type":"string"}},"required":["product_id","name","kind"],"type":"object"},"CreateEvidenceRequest":{"additionalProperties":false,"properties":{"build_id":{"type":"string"},"collector_id":{"type":"string"},"deployment_id":{"type":"string"},"limitations":{"items":{"type":"string"},"type":"array"},"metadata":{"additionalProperties":true,"type":"object"},"observed_at":{"format":"date-time","type":"string"},"payload_hash":{"pattern":"^sha256:","type":"string"},"payload_media_type":{"type":"string"},"payload_ref":{"type":"string"},"payload_size":{"minimum":0,"type":"integer"},"product_id":{"type":"string"},"project_id":{"type":"string"},"release_id":{"type":"string"},"source_identity":{"additionalProperties":true,"type":"object"},"source_system":{"type":"string"},"subject_refs":{"items":{"$ref":"#/components/schemas/SubjectRef"},"type":"array"},"subtype":{"type":"string"},"tags":{"items":{"type":"string"},"type":"array"},"title":{"type":"string"},"type":{"type":"string"}},"required":["type","title","payload_hash"],"type":"object"},"CreateEvidenceSummaryRequest":{"additionalProperties":false,"properties":{"evidence_ids":{"description":"Omit or use [] for automatic selection; explicit identifiers must remain unique and non-blank after trimming, with at most 1024 bytes each.","items":{"maxLength":1024,"minLength":1,"type":"string"},"maxItems":512,"type":"array","uniqueItems":true},"subject_id":{"description":"Non-blank, NUL-free UTF-8 identifier, at most 1024 bytes after trimming.","maxLength":1024,"minLength":1,"type":"string"},"subject_type":{"enum":["tenant","product","release","evidence","build","customer_package"],"type":"string"}},"required":["subject_type","subject_id"],"type":"object"},"CreateExceptionRequest":{"additionalProperties":false,"properties":{"control_id":{"type":"string"},"expires_at":{"format":"date-time","type":"string"},"finding_id":{"type":"string"},"owner":{"type":"string"},"reason":{"type":"string"},"release_id":{"type":"string"}},"required":["release_id","reason","owner","expires_at"],"type":"object"},"CreateGraphSnapshotRequest":{"additionalProperties":false,"properties":{"product_id":{"description":"Optional stored product filter and graph root. At least one product/release ID must be non-blank. Raw IDs are capped at 1024 UTF-8 bytes, trimmed, and NUL-free. A supplied product must own the supplied release.","maxLength":1024,"type":"string"},"release_id":{"description":"Optional stored release filter and graph root. Raw IDs are capped at 1024 UTF-8 bytes, trimmed, and NUL-free. Release-only graphs authorize the current product parent without adding an inferred product filter or node. PostgreSQL commits bounded adjacency, audit, and replay atomically.","maxLength":1024,"type":"string"}},"type":"object"},"CreateIncidentRequest":{"additionalProperties":false,"properties":{"opened_at":{"format":"date-time","type":"string"},"product_id":{"type":"string"},"release_id":{"type":"string"},"severity":{"enum":["low","medium","high","critical"],"type":"string"},"title":{"type":"string"}},"required":["product_id","title","severity"],"type":"object"},"CreateIncidentWebhookReceiverRequest":{"additionalProperties":false,"properties":{"name":{"type":"string"},"provider":{"type":"string"},"public_key":{"description":"Ed25519 public key used to verify signed incident webhook events.","type":"string"}},"required":["name","provider","public_key"],"type":"object"},"CreateLegalHoldRequest":{"additionalProperties":false,"description":"Creates an append-only retention marker; it does not enforce provider storage lifecycle or establish a legal conclusion. Current tenant-wide admin authority and locked subject ownership are checked before reservation and every native PostgreSQL replay. Marker, audit and successful replay writes commit together without a Ledger clone. Both profiles reject unknown, duplicate, case-aliased, explicitly null, invalid UTF-8/NUL or over-budget fields; the whole JSON body is capped at 64 KiB. Unsafe cookie writes require same-origin protection. Local memory retains explicit nondurable compatibility storage.","properties":{"owner":{"description":"Nonblank owner; raw NUL-free UTF-8 is capped at 64 KiB before trimming. Do not include credentials.","maxLength":65536,"minLength":1,"type":"string"},"reason":{"description":"Nonblank reason; raw NUL-free UTF-8 is capped at 64 KiB before trimming. Do not include credentials.","maxLength":65536,"minLength":1,"type":"string"},"scope_id":{"description":"Current tenant-owned subject ID; raw NUL-free UTF-8 is capped at 1024 bytes before trimming.","maxLength":1024,"minLength":1,"type":"string"},"scope_type":{"description":"Raw NUL-free UTF-8 is capped at 64 bytes before trimming.","enum":["tenant","product","project","release","evidence"],"maxLength":64,"type":"string"}},"required":["scope_type","scope_id","reason","owner"],"type":"object"},"CreateMarketplaceCollectorRequest":{"additionalProperties":false,"properties":{"manifest_hash":{"description":"Raw NUL-free UTF-8 is capped at 128 bytes before trimming; sha256: plus 64 hexadecimal characters, preserving hex case. This records a declared digest without verifying package bytes.","maxLength":128,"pattern":"^\\s*sha256:[A-Fa-f0-9]{64}\\s*$","type":"string"},"name":{"description":"Nonblank package label; raw NUL-free UTF-8 is capped at 256 bytes before trimming.","maxLength":256,"minLength":1,"type":"string"},"provider":{"description":"Nonblank provider label; raw NUL-free UTF-8 is capped at 256 bytes before trimming. Registration does not endorse a provider.","maxLength":256,"minLength":1,"type":"string"},"publisher":{"description":"Nonblank publisher label; raw NUL-free UTF-8 is capped at 256 bytes before trimming.","maxLength":256,"minLength":1,"type":"string"},"sbom_id":{"description":"Optional current tenant-owned SBOM reference; omission or empty string is allowed, whitespace-only is rejected. Raw NUL-free UTF-8 is capped at 1024 bytes before trimming.","maxLength":1024,"type":"string"},"scan_id":{"description":"Optional current tenant-owned scan reference; omission or empty string is allowed, whitespace-only is rejected. Raw NUL-free UTF-8 is capped at 1024 bytes before trimming.","maxLength":1024,"type":"string"},"signature_id":{"description":"Optional current tenant-owned signature reference; omission or empty string is allowed, whitespace-only is rejected. Raw NUL-free UTF-8 is capped at 1024 bytes before trimming.","maxLength":1024,"type":"string"},"version":{"description":"Nonblank package version; raw NUL-free UTF-8 is capped at 128 bytes before trimming.","maxLength":128,"minLength":1,"type":"string"}},"required":["name","provider","version","publisher","manifest_hash"],"type":"object"},"CreateMerkleBatchRequest":{"additionalProperties":false,"description":"Creates a signed commitment to selected stored audit-entry hashes. PostgreSQL uses native durable execution with current tenant-wide keys:admin authority checked before reservation and replay; human sessions need a matching tenant grant. The common writer fence precedes tenant, chain, leaf and signing-key locks. Fresh creation checks the contiguous nonblank chain index and reads at most 4096 selected leaves within an 8 MiB encoded-view budget, without loading audit bodies or unrelated tenant state. Initial key if needed, signature, batch, caller audit and successful replay commit together. Completed replay returns the original range/root/signature references without reading the current chain or signing again; changed request bytes conflict. Both profiles reject unknown, duplicate, case-aliased, explicitly null and malformed fields; the body is capped at 64 KiB. Cookie mutations require same-origin protection. Local memory remains nondurable. Creation does not independently verify every audit record, external publication, release security or legal compliance.","properties":{"from_sequence":{"description":"Optional nonnegative lower bound; zero or omission selects sequence 1 on fresh creation.","format":"int64","minimum":0,"type":"integer"},"to_sequence":{"description":"Optional nonnegative upper bound; zero or omission selects the current last sequence on fresh creation. A nonzero upper bound cannot precede the lower bound.","format":"int64","minimum":0,"type":"integer"}},"type":"object"},"CreateObjectRetentionPolicyRequest":{"additionalProperties":false,"description":"Records retention intent only; creation does not prove provider enforcement. PostgreSQL uses focused durable commands without Ledger replay. Current tenant-wide admin authority and tenant existence are checked before reservation and replay. Policy, audit and successful replay commit together. Both profiles reject unknown, duplicate, case-aliased, explicitly null, invalid UTF-8/NUL or over-budget fields before execution; the whole JSON body is capped at 64 KiB. Unsafe cookie-authenticated mutations require same-origin protection. Local memory retains explicit nondurable replay.","properties":{"max_verification_age_hours":{"description":"Maximum age of a successful provider observation before it is reported as stale. Defaults to 24 hours.","maximum":8784,"minimum":1,"type":"integer"},"mode":{"description":"Raw NUL-free UTF-8 is capped at 4096 bytes before trimming.","enum":["governance","compliance"],"maxLength":4096,"type":"string"},"name":{"description":"Nonblank name; raw NUL-free UTF-8 is capped at 4096 bytes before trimming.","maxLength":4096,"minLength":1,"type":"string"},"object_key":{"description":"Optional sample object key under the policy's tenant-owned prefix; required when require_legal_hold is true. Raw NUL-free UTF-8 is capped at 4096 bytes before trimming.","maxLength":4096,"type":"string"},"object_prefix":{"description":"Tenant-owned object-store prefix, defaulting to tenants/\u003ctenant_id\u003e/. Raw NUL-free UTF-8 is capped at 4096 bytes before trimming.","maxLength":4096,"type":"string"},"require_legal_hold":{"description":"When true, the sample object key must have provider-reported legal hold enabled.","type":"boolean"},"retention_days":{"maximum":2147483647,"minimum":1,"type":"integer"}},"required":["name","mode","retention_days"],"type":"object"},"CreateOpenAPIDiffRequest":{"additionalProperties":false,"properties":{"base_contract_id":{"type":"string"},"release_id":{"type":"string"},"target_contract_id":{"type":"string"}},"required":["base_contract_id","target_contract_id","release_id"],"type":"object"},"CreateOrganizationRequest":{"additionalProperties":false,"properties":{"name":{"type":"string"},"slug":{"type":"string"}},"required":["name","slug"],"type":"object"},"CreatePDFReportPackageRequest":{"additionalProperties":false,"properties":{"product_id":{"description":"Optional submitted product coordinate. At least one product/release ID must be nonblank. Raw UTF-8 IDs are capped at 1024 bytes, trimmed and NUL-free; a supplied product must own the supplied release.","maxLength":1024,"type":"string"},"release_id":{"description":"Optional submitted release coordinate. Release-only creation checks the current product parent without adding a product_id to the record.","maxLength":1024,"type":"string"},"report_type":{"description":"Nonblank trimmed descriptive metadata, not a renderer selector. Raw single-line UTF-8 is capped at 128 bytes and excludes control characters.","maxLength":128,"minLength":1,"type":"string"},"title":{"description":"Nonblank single-line title, trimmed after validating at most 64 KiB raw UTF-8 without control characters or Unicode line/paragraph separators. The existing payload is a minimal title-only envelope, not a full evidence report.","maxLength":65536,"minLength":1,"type":"string"}},"required":["report_type","title"],"type":"object"},"CreateProductRequest":{"additionalProperties":false,"description":"Product creation accepts name and slug and requires product:write. PostgreSQL human sessions also need a matching tenant-level grant, not a grant on an existing product. Authorization is rechecked before a tenant-scoped boolean slug-existence query, and product/audit effects commit together; cached Ledger products are not used. Slugs are unique within a tenant: a different-key request for an existing slug returns 409, while same-key replay returns the original product. Trimmed names and slugs must be non-empty, NUL-free UTF-8; new names are bounded at 64 KiB of UTF-8 bytes and slugs at 1024 bytes. The entire HTTP JSON body is limited to 64 KiB, including syntax and escapes. Invalid input returns 400 without product/audit writes. Creation timestamps use microsecond-precision UTC. Explicit local-memory mode retains its compatibility binding.","properties":{"name":{"type":"string"},"slug":{"description":"Nonempty product slug, trimmed before validation; at most 1024 UTF-8 bytes so the tenant/slug natural identity fits the supported PostgreSQL index.","type":"string"}},"required":["name","slug"],"type":"object"},"CreateProjectRequest":{"additionalProperties":false,"description":"Project creation accepts only product_id and name and requires project:write. PostgreSQL human sessions also need a tenant or matching product grant. The current tenant-owned product is rechecked in the write transaction and project/audit effects commit together; cached Ledger products are not used. Trimmed product IDs and names must be non-empty, NUL-free UTF-8; product IDs are bounded at 1024 UTF-8 bytes and new project names at 64 KiB of UTF-8 bytes. Unsupported input returns 400 and oversized stored parent coordinates return 409, never truncated values. Explicit local-memory mode retains its compatibility path.","properties":{"name":{"type":"string"},"product_id":{"type":"string"}},"required":["product_id","name"],"type":"object"},"CreatePublicTransparencyLogRequest":{"additionalProperties":false,"properties":{"endpoint":{"description":"Absolute HTTPS URL with a host, without userinfo or fragment; raw NUL-free UTF-8 is capped at 4096 bytes before trimming. Registration makes no network request.","maxLength":4096,"minLength":1,"type":"string"},"name":{"description":"Nonblank log label; raw NUL-free UTF-8 is capped at 256 bytes before trimming.","maxLength":256,"minLength":1,"type":"string"},"public_key":{"description":"Nonblank operator-supplied public key metadata, not cryptographically verified by registration; raw NUL-free UTF-8 is capped at 16384 bytes before trimming. Do not submit private key material.","maxLength":16384,"minLength":1,"type":"string"}},"required":["name","endpoint","public_key"],"type":"object"},"CreateQuestionnaireAnswerLibraryEntryRequest":{"additionalProperties":false,"anyOf":[{"properties":{"question_id":{"minLength":1}},"required":["question_id"]},{"properties":{"evidence_type":{"minLength":1}},"required":["evidence_type"]},{"properties":{"control_id":{"minLength":1}},"required":["control_id"]}],"properties":{"answer":{"description":"Required nonblank draft answer, trimmed after a 64 KiB raw UTF-8/NUL-free byte bound. The complete HTTP body retains its 64 KiB limit.","maxLength":65536,"minLength":1,"type":"string"},"control_id":{"description":"Optional current same-tenant control with a same-tenant framework.","maxLength":1024,"type":"string"},"evidence_ids":{"description":"Optional current same-tenant evidence references, sorted with duplicates preserved; each ID is nonblank and bounded to 1024 raw bytes. All stored parents must be coherent.","items":{"maxLength":1024,"minLength":1,"type":"string"},"maxItems":4096,"type":"array"},"evidence_type":{"description":"Optional inert evidence-type selector, not a validation or trust claim.","maxLength":1024,"type":"string"},"limitations":{"description":"Optional limitations, each bounded to 64 KiB raw bytes, trimmed/sorted with duplicates and blanks preserved. Omitted or empty arrays use the existing human-review warning.","items":{"maxLength":65536,"type":"string"},"maxItems":128,"type":"array"},"product_id":{"description":"Optional current tenant-owned product; must agree with release_id. Citation filtering uses stored product_id, not inferred evidence parents.","maxLength":1024,"type":"string"},"question_id":{"description":"Optional question selector; at least one nonblank question_id, evidence_type or control_id is required. Raw input is bounded to 1024 UTF-8/NUL-free bytes before trimming.","maxLength":1024,"type":"string"},"release_id":{"description":"Optional current tenant-owned release; its product is resolved for authorization only, not added to the response.","maxLength":1024,"type":"string"}},"required":["answer"],"type":"object"},"CreateQuestionnaireDraftRequest":{"additionalProperties":false,"properties":{"product_id":{"description":"Optional tenant-owned product; must agree with release_id when both are supplied.","maxLength":1024,"type":"string"},"release_id":{"description":"Optional tenant-owned release; current parent ownership is checked.","maxLength":1024,"type":"string"},"template_id":{"description":"Required tenant-owned template identifier; trimmed after a 1024-byte UTF-8/NUL-free input bound.","maxLength":1024,"minLength":1,"type":"string"}},"required":["template_id"],"type":"object"},"CreateQuestionnairePackageRequest":{"additionalProperties":false,"properties":{"package_id":{"description":"Optional current tenant-owned customer package association, independently authorized and coherent with explicit selection coordinates. It never supplies an implicit evidence filter or redaction.","maxLength":1024,"type":"string"},"product_id":{"description":"Optional tenant-owned product selection; must agree with release_id and package_id when supplied.","maxLength":1024,"type":"string"},"release_id":{"description":"Optional tenant-owned release selection; its product is resolved for authorization only, not added to the stored selection.","maxLength":1024,"type":"string"},"template_id":{"description":"Required tenant-owned template; raw UTF-8/NUL-free bytes are bounded before trimming.","maxLength":1024,"minLength":1,"type":"string"}},"required":["template_id"],"type":"object"},"CreateQuestionnaireQuestion":{"additionalProperties":false,"properties":{"allowed_fields":{"description":"Inert metadata, trimmed and sorted; duplicates and blank strings retain their existing meaning.","items":{"description":"Raw UTF-8/NUL-free input is limited to 1024 bytes.","maxLength":1024,"type":"string"},"maxItems":128,"type":"array"},"control_id":{"description":"Optional trimmed tenant-owned control with a current same-tenant framework; raw UTF-8/NUL-free input is limited to 1024 bytes.","maxLength":1024,"type":"string"},"evidence_type":{"description":"Optional trimmed evidence selector; raw UTF-8/NUL-free input is limited to 1024 bytes.","maxLength":1024,"type":"string"},"id":{"description":"Nonblank and unique after trimming; raw UTF-8/NUL-free input is limited to 1024 bytes.","maxLength":1024,"minLength":1,"type":"string"},"prompt":{"description":"Nonblank prompt, trimmed after a 64 KiB raw UTF-8/NUL-free input bound.","maxLength":65536,"minLength":1,"type":"string"}},"required":["id","prompt"],"type":"object"},"CreateQuestionnaireTemplateRequest":{"additionalProperties":false,"properties":{"name":{"description":"Required nonblank name; trimmed after a 1024-byte UTF-8/NUL-free raw input bound.","maxLength":1024,"minLength":1,"type":"string"},"questions":{"description":"Ordered questions with unique trimmed IDs; aggregate input text and encoded template are each limited to 4 MiB.","items":{"$ref":"#/components/schemas/CreateQuestionnaireQuestion"},"maxItems":512,"minItems":1,"type":"array"},"version":{"description":"Required nonblank version; trimmed after a 1024-byte UTF-8/NUL-free raw input bound.","maxLength":1024,"minLength":1,"type":"string"}},"required":["name","version","questions"],"type":"object"},"CreateRedactionProfileRequest":{"additionalProperties":false,"description":"New profiles require a supported preset or a nonblank name and nonempty allowed_types. Raw name, description, and preset are limited to 65536 UTF-8 bytes before trimming; each allow/exclude entry to 1024 bytes, and each array to 1024 entries before deduplication. NUL and malformed UTF-8 are rejected. Normalized types are sorted and deduplicated; blank excluded_fields are discarded. Unknown type/field names remain metadata, not additional permission. Requests retain the 64 KiB JSON body limit. Duplicate/case-aliased keys and explicit null fields/items are rejected. Historical profile responses are not restricted by these creation bounds.","properties":{"allowed_types":{"items":{"maxLength":1024,"type":"string"},"maxItems":1024,"type":"array"},"description":{"maxLength":65536,"type":"string"},"excluded_fields":{"items":{"maxLength":1024,"type":"string"},"maxItems":1024,"type":"array"},"name":{"maxLength":65536,"type":"string"},"preset":{"description":"Optional standard profile preset. When set, allowed_types and excluded_fields are server-defined and must be omitted.","enum":["customer_safe","security_review"],"maxLength":65536,"type":"string"}},"type":"object"},"CreateReleaseBundleRequest":{"additionalProperties":false,"description":"Creates a signed release evidence bundle; it does not establish legal compliance, complete evidence or a secure release. Native PostgreSQL execution checks current release/product access before reservation and every replay, using flat share locks after the tenant fence. Bundle, signature, audit, worker job and successful replay commit together without a Ledger clone. Replay does not read manifest inputs or signing-key material and does not sign again. Both profiles reject unknown, duplicate, case-aliased, explicitly null, invalid UTF-8/NUL or over-budget fields; the whole JSON body is capped at 64 KiB. Unsafe cookie writes require same-origin protection. Local memory retains explicit nondurable compatibility storage.","properties":{"release_id":{"description":"Nonblank current tenant-owned release ID; raw NUL-free UTF-8 is capped at 1024 bytes before trimming.","maxLength":1024,"minLength":1,"type":"string"}},"required":["release_id"],"type":"object"},"CreateReleaseCandidateRequest":{"additionalProperties":false,"description":"PostgreSQL candidate creation uses a focused durable command requiring release:write and a matching tenant/product/release grant for human sessions. Current tenant-owned parent coordinates and all supplied reference IDs are validated in the active transaction without foreign-context payload or cached Ledger reads. Builds and parsed evidence/bundle references must belong to the same release; artifacts are tenant-scoped and human reuse needs a current authorized build/evidence association. Missing, foreign, wrong-release, or inconsistent source-evidence references return 404, and grant denial returns 403. Trimmed names and IDs are non-empty, NUL-free UTF-8: new names are bounded at 64 KiB, parent/reference IDs at 1024 bytes, and the combined reference arrays at 4096 entries and 64 KiB of identifier bytes. Sorting preserves duplicates. The whole HTTP JSON body is capped at 64 KiB including syntax/escapes. Invalid input returns 400 without candidate/audit writes. New snapshots start open at revision 1 with microsecond-precision UTC timestamps and the existing versioned normalized-JSON snapshot hash; candidate/audit effects commit together. Same-key replay returns the original snapshot and changed request bytes conflict. Local-memory creation retains its explicit compatibility binding.","properties":{"artifact_ids":{"items":{"type":"string"},"type":"array"},"build_ids":{"items":{"type":"string"},"type":"array"},"bundle_ids":{"items":{"type":"string"},"type":"array"},"contract_ids":{"items":{"type":"string"},"type":"array"},"name":{"type":"string"},"release_id":{"type":"string"},"sbom_ids":{"items":{"type":"string"},"type":"array"},"scan_ids":{"items":{"type":"string"},"type":"array"},"vex_ids":{"items":{"type":"string"},"type":"array"}},"required":["release_id","name"],"type":"object"},"CreateReleaseRequest":{"additionalProperties":false,"description":"Release creation accepts product_id and version and requires release:write. PostgreSQL human sessions also need a tenant or matching product grant. The current tenant-owned product is rechecked in the write transaction and release/audit effects commit together; cached Ledger products and releases are not used. New releases start in draft at revision 1. Versions are unique within each product: a different-key request for an existing version returns 409, while same-key replay returns the original release. Trimmed product IDs and versions must be non-empty, NUL-free UTF-8; product IDs are bounded at 1024 UTF-8 bytes and new release versions at 64 KiB of UTF-8 bytes. Unsupported input returns 400 and oversized stored parent coordinates return 409, never truncated values. Explicit local-memory mode retains its compatibility path. Recording a release does not assert approval, verification, or compliance.","properties":{"product_id":{"type":"string"},"version":{"type":"string"}},"required":["product_id","version"],"type":"object"},"CreateRemediationTaskRequest":{"additionalProperties":false,"properties":{"due_at":{"format":"date-time