 UTF-8 bytes before trimming. PostgreSQL uses native durable execution with a read-only current build/parent/output-artifact ownership and grant guard on every retry, without Ledger replay or refresh. Identical bytes replay the original public response without reparsing or staging; changed bytes under the same key conflict. Fresh ingestion still verifies observed payload hash/size, output digests and subject coverage, and commits evidence, attestation, caller audits, payload records, worker jobs and replay completion together. HTTP responses omit private payload_ref storage coordinates. Structurally_valid is not signature verification; managed worker-owned projections stay accepted/pending until the worker runs. Upload concurrency limits apply; cookie writes require same-host HTTPS Origin with Bearer precedence. Local memory remains nondurable.","operationId":"uploadBuildAttestation","parameters":[{"description":"Build run id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/DSSEEnvelope"}}},"description":"DSSE envelope.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BuildAttestationEnvelope"}}},"description":"Created build attestation envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Upload build attestation","tags":["evydence"],"x-evydence-owner":"release-catalog","x-evydence-stability":"core","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["build:write"]}},"/v1/collectors":{"get":{"description":"Lists tenant-scoped collector metadata without API key hashes or one-time secrets. Results use bounded keyset pagination. Cursor tokens are opaque and bound to the tenant, filters, sort, and direction.","operationId":"listCollectors","parameters":[{"description":"Opaque continuation token returned as meta.next_cursor. It must be reused with the same tenant, filters, sort, and direction.","in":"query","name":"cursor","required":false,"schema":{"maxLength":4096,"minLength":1,"type":"string"}},{"description":"Sort direction for cursor pagination.","in":"query","name":"direction","required":false,"schema":{"default":"asc","enum":["asc","desc"],"type":"string"}},{"description":"Maximum records in this page. Defaults to 50 and is capped at 500.","in":"query","name":"page_size","required":false,"schema":{"default":50,"maximum":500,"minimum":1,"type":"integer"}},{"description":"Stable sort key for cursor pagination.","in":"query","name":"sort","required":false,"schema":{"default":"created_at","enum":["created_at","id"],"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectorListEnvelope"}}},"description":"Collector list envelope."},"400":{"cont