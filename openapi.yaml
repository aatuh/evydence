"]}},"/v1/audit-chain/verify":{"get":{"description":"Recomputes tenant audit-chain entry hashes, continuity, schema versions, and referenced signatures. This local verification does not by itself prove protection from an administrator able to rewrite all history and signing material.","operationId":"verifyAuditChain","responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VerificationResultEnvelope"}}},"description":"Audit chain verification envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Verify audit chain","tags":["evydence"],"x-evydence-stability":"experimental","x-scopes":["verify:read"]}},"/v1/audit-log":{"get":{"description":"Lists tenant-scoped append-only audit-chain entries in reverse chronological order. Human sessions require a tenant-wide admin grant. Results use bounded keyset pagination. Cursor tokens are opaque and bound to the tenant, filters, sort, and direction.","operationId":"listAuditLog","parameters":[{"description":"Opaque continuation token returned as meta.next_cursor. It must be reused with the same tenant, filters, sort, and direction.","in":"query","name":"cursor","required":false,"schema":{"maxLength":4096,"minLength":1,"type":"string"}},{"description":"Sort direction for cursor pagination.","in":"query","name":"direction","required":false,"schema":{"default":"desc","enum":["asc","desc"],"type":"string"}},{"description":"Deprecated maximum returned entries alias; defaults to 50 and caps at 500.","in":"query","name":"limit","required":false,"schema":{"maximum":100,"minimum":1,"type":"integer"}},{"description":"Maximum records in this page. Defaults to 50 and is capped at 500.","in":"query","name":"page_size","required":false,"schema":{"default":50,"maximum":500,"minimum":1,"type":"integer"}},{"description":"Only include entries at or after this RFC3339 timestamp.","in":"query","name":"since","required":false,"schema":{"type":"string"}},{"description":"Stable sort key for cursor pagination.","in":"query","name":"sort","required":false,"schema":{"default":"created_at","enum":["created_at","id"],"type":"string"}},{"description":"Filter by audited subject id.","in":"query","name":"subject_id","required":false,"schema":{"type":"string"}},{"description":"Filter by audited subject type.","in":"query","name":"subject_type","required":false,"schema":{"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AuditChainEntryListEnvelope"}}},"description":"Audit-chain entry list envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json"