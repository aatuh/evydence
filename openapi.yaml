,"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Revoke signing key","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["keys:admin"]}},"/v1/signing-operations":{"post":{"description":"Requests a configured signing executor to sign a canonical request binding the provider, key reference, subject, payload digest, request id, and nonce. Caller-supplied signatures are rejected.","operationId":"createSigningOperation","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateSigningOperationRequest"}}},"description":"Signing operation creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SigningOperationEnvelope"}}},"description":"Created signing operation envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create signing provider operation receipt","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["keys:admin"]}},"/v1/signing-providers":{"post":{"description":"Creates signing provider metadata for external signing operations. Production private key material must not be supplied.","operationId":"createSigningProvider","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateSigningProviderRequest"}}},"description":"Signing provider creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SigningProviderEnvelope"}}},"description":"Created signing provider envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create signing provider record","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["keys:admin"]}},"/v1/source/branches":{"post":{"description":"Records or replaces source branch metadata after current repository tenant/project authorization before metadata reads. PostgreSQL mode requires any supplied head commit to belong to the same repository and tenant. Existing branch identity and creation time are retained; head, protected flag and protection hash are replaced, including defaults when omitted. Repository/name upserts serialize; each executed create/update and its audit persist in the same transaction with replay state. Combined tenant/repository/name identity is limited to 2304 UTF-8 bytes and protection hash metadata to 64 KiB. A supplied protection hash is recorded metadata only; recording does not verify provider identity or branch protection. PostgreSQL HTTP uses native durable replay with a read-only current tenant/repository/product/project and optional-head guard before reservation and completed replay, without mutable branch metadata reads, clocks or IDs. The common writer fence precedes tenant/repository/parent/head locks held through the outer replay commit. Original public JSON and request-byte fingerprints are preserved without reapplying old branch state; no outbox job is created. Raw bounds are checked before trimming within the 64 KiB HTTP envelope; whitespace-only supplied heads return not found. Cookie writes require same-host HTTPS Origin; explicit bearer credentials take precedence. Local memory shares input/current-grant checks but retains nondurable map storage.","operationId":"upsertSourceBranch","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/UpsertSourceBranchRequest"}}},"description":"Source branch upsert request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SourceBranchEnvelope"}}},"description":"Source branch envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Record source branch","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["source:write"]}},"/v1/source/commits":{"post":{"description":"Records immutable source commit metadata using current repository tenant/project authorization before metadata reads. PostgreSQL mode normalizes 40-character hexadecimal SHAs to lowercase and returns the original repository/SHA record without changing metadata or auditing twice. Commit and audit are persisted in the same transaction. Stores only sha256 of exact nonblank message bytes; whitespace-only messages have no hash. Author and message inputs are bounded to 64 KiB; timestamps use UTC microseconds and committed_at defaults to recording time when omitted. Recording does not verify provider identity or repository contents. PostgreSQL HTTP uses native durable replay with a read-only current tenant/repository/product/project guard before reservation and completed replay, without metadata reads, clocks or IDs. The common writer fence precedes tenant/repository/parent locks held through the outer replay commit. Original public JSON and request-byte fingerprints are preserved, with no outbox job. Raw bounds are checked before trimming; IDs and raw SHA text are limited to 1024 bytes within the 64 KiB HTTP envelope. Cookie writes require same-host HTTPS Origin; explicit bearer credentials take precedence. Local memory shares input/current-grant checks but retains nondurable map storage.","operationId":"recordSourceCommit","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RecordSourceCommitRequest"}}},"description":"Source commit creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SourceCommitEnvelope"}}},"description":"Created source commit envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Record source commit","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["source:write"]}},"/v1/source/pull-requests":{"post":{"description":"Records an append-only pull-request metadata snapshot after current repository tenant/project authorization before metadata reads. Any supplied head commit must belong to the same repository and tenant. Each non-replayed call creates a new snapshot, even for the same provider ID; recording does not update an earlier snapshot. An omitted provider defaults to the stored repository provider. Snapshot, audit and HTTP replay state persist in the same transaction. Tenant/repository/head IDs are bounded to 1024 UTF-8 bytes and submitted metadata to 64 KiB; states are open, closed or merged. Recording does not verify provider identity, repository contents, review approval or merge authority. PostgreSQL HTTP uses native durable replay with a read-only current tenant/repository/product/project and optional-head guard before reservation and completed replay, without provider defaults, earlier snapshots, clocks or IDs. The common writer fence precedes tenant/repository/parent/head locks held through the outer replay commit. Original public JSON and request-byte fingerprints are preserved, with no outbox job. Raw bounds are checked before trimming within the 64 KiB HTTP envelope; whitespace-only supplied heads return not found. Cookie writes require same-host HTTPS Origin; explicit bearer credentials take precedence. Local memory shares input/current-grant checks but retains nondurable map storage.","operationId":"recordPullRequest","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RecordPullRequestRequest"}}},"description":"Pull request record request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PullRequestEnvelope"}}},"description":"Created pull request envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Record pull request","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["source:write"]}},"/v1/source/repositories":{"get":{"description":"Lists tenant-scoped source repositories, optionally filtered by project. Results use bounded keyset pagination. Cursor tokens are opaque and bound to the tenant, filters, sort, and direction.","operationId":"listSourceRepositories","parameters":[{"description":"Opaque continuation token returned as meta.next_cursor. It must be reused with the same tenant, filters, sort, and direction.","in":"query","name":"cursor","required":false,"schema":{"maxLength":4096,"minLength":1,"type":"string"}},{"description":"Sort direction for cursor pagination.","in":"query","name":"direction","required":false,"schema":{"default":"asc","enum":["asc","desc"],"type":"string"}},{"description":"Maximum records in this page. Defaults to 50 and is capped at 500.","in":"query","name":"page_size","required":false,"schema":{"default":50,"maximum":500,"minimum":1,"type":"integer"}},{"description":"Project id.","in":"query","name":"project_id","required":false,"schema":{"type":"string"}},{"description":"Stable sort key for cursor pagination.","in":"query","name":"sort","required":false,"schema":{"default":"created_at","enum":["created_at","id"],"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SourceRepositoryListEnvelope"}}},"description":"Source repository list envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"List source repositories","tags":["evydence"],"x-evydence-stability":"experimental","x-scopes":["source:read"]},"post":{"description":"Creates source repository metadata with source:write authorization and native durable replay in PostgreSQL. A read-only current tenant/ownership guard runs before reservation and completed replay, without reading clone URLs or branch metadata or allocating IDs. PostgreSQL serializes tenant/provider/full-name reuse and returns the existing repository unchanged without another audit entry. Human sessions need a tenant-wide grant for detached creation, or a matching product/project grant for attached creation; the existing repository is separately authorized before metadata is read. The tenant fence and submitted/existing product/project locks survive through the outer replay commit. Raw UTF-8 and NUL-free text bounds are checked before trimming; IDs are bounded at 1024 bytes, tenant/provider/full-name keys at 2304 bytes and optional metadata at 64 KiB, within the 64 KiB HTTP envelope. Repository and audit records commit in the same transaction as HTTP replay state, with no outbox job. Completed replay preserves the original public response and request-byte fingerprint. Cookie-authenticated writes require a same-host HTTPS Origin; explicit bearer credentials take precedence. Local memory shares input and current-grant checks but retains nondurable map storage. This records supplied metadata and does not contact or verify the provider, clone URL or repository contents.","operationId":"createSourceRepository","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateSourceRepositoryRequest"}}},"description":"Source repository creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SourceRepositoryEnvelope"}}},"description":"Created source repository envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create source repository","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["source:write"]}},"/v1/sso/identity-links":{"post":{"description":"Records an administrator-asserted verified provider subject for a current tenant-owned user with matching normalized email. PostgreSQL uses a focused Identity transaction: current tenant-wide identity:admin authority and parent ownership/email checks precede reservation or replay; link, audit and safe replay commit atomically. This does not verify a live provider credential, activate the user/provider, issue a session or grant roles.","operationId":"linkSSOIdentity","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LinkSSOIdentityRequest"}}},"description":"Required non-null fields; verified must be true. IDs are bounded to 1 KiB each; tenant, provider and case-sensitive subject together are bounded to 2304 UTF-8 bytes. Email must be a plain mailbox, normalized by trimming/lowercasing, with tenant and email together at most 2304 bytes. Malformed, duplicate, unknown or trailing JSON is rejected. Existing tenant/provider/subject identities conflict rather than being reassigned.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/UserIdentityLinkEnvelope"}}},"description":"Created SSO identity link envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Link SSO identity","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["identity:admin"]}},"/v1/sso/logout":{"post":{"description":"Revokes only the currently authenticated user's tenant-owned SSO session without requiring administration grants. API and collector keys cannot use this route. PostgreSQL uses bounded hash-free locked metadata and one revocation/audit/replay transaction without Ledger inventories. The HttpOnly Secure SameSite=Strict cookie at /v1 is cleared only after successful durable commit, never on failure. A revoked or expired secret cannot authenticate another request, including saved-receipt replay. Ambient session-cookie requests require a single HTTPS Origin matching request Host; bearer requests do not. HTTPS proxies must preserve the public Host.","operationId":"logoutSSOSession","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EmptyObject"}}},"description":"Optional empty body or strict empty JSON object only, bounded at 64 KiB. Unknown/duplicate fields, null, malformed UTF-8 and trailing values are rejected.","required":false},"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SSOSessionEnvelope"}}},"description":"Revoked current SSO session envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Logout SSO session","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"supported","x-idempotency-key":{"header":"Idempotency-Key","required":true}}},"/v1/sso/providers":{"post":{"description":"Records tenant SSO provider metadata. PostgreSQL uses focused Identity commands with current tenant-wide administration and input validation before reservation or completed replay, and atomic provider/audit/replay writes without Ledger reloads. Required issuer metadata is an absolute HTTPS URL with a host, no userinfo and no fragment; stored text is bounded, UTF-8 and NUL-free. Explicit null fields/items are rejected. Another key creates another provider for identical metadata. Authorized replay preserves harmless group names within the public provider DTO without weakening generic privacy redaction. Optional static JWKS public keys and SAML signing certificates can be supplied for local token/assertion verification without live provider calls. Shared stateless Identity normalization rejects private/symmetric JOSE members, retains supported public JWK fields only, and normalizes parsed RSA certificates without trailing PEM blocks. This validates supported metadata shapes, not provider ownership or key custody; historical rows and backups are not scrubbed.","operationId":"createSSOProvider","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateSSOProviderRequest"}}},"description":"SSO provider creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SSOProviderEnvelope"}}},"description":"Created SSO provider envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create SSO provider","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["identity:admin"]}},"/v1/sso/providers/{id}/discover-oidc":{"post":{"description":"Fetches the OIDC discovery document and public JWKS for the tenant provider issuer, then stores normalized public trust material. PostgreSQL uses focused Identity commands and a bounded tenant-owned provider read, not Ledger state or provider inventories. Current tenant-wide administration, provider ownership/type and strict optional empty-object body checks precede reservation or replay without network calls. A newly acquired command uses the configured hardened discovery adapter; conditional trust update, canonical-hash audit and safe replay completion commit together. Authorized completed retries return the original public provider without refetching. Private/symmetric JOSE members, empty keys, issuer mismatch and malformed or unsafe retained public text fail verification without replacing current trust or appending an audit; unsupported extension metadata is not retained. Missing/foreign providers return 404, oversized stored metadata returns 409 and provider verification failures return 422. This does not authenticate users, prove provider ownership, scrub historical records/backups, or synchronize groups.","operationId":"refreshSSOProviderOIDCTrustMaterial","parameters":[{"description":"SSO provider id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EmptyObject"}}},"description":"Empty JSON object.","required":false},"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SSOProviderEnvelope"}}},"description":"Refreshed SSO provider envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Refresh SSO provider OIDC trust material","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["identity:admin"]}},"/v1/sso/providers/{id}/trust-material":{"post":{"description":"Rotates tenant SSO provider public trust material for local OIDC ID-token or SAML assertion verification. PostgreSQL uses focused Identity commands and one bounded tenant-owned provider read, not Ledger state or provider inventories. Current tenant-wide administration, input and provider checks run before reservation or completed replay; update, canonical-hash audit and safe replay completion commit together. Foreign/missing providers return 404; oversized or ill-typed stored metadata returns 409 without truncation. OIDC requires nonempty JWKS only; SAML requires signing certificates only. Strict decoding rejects invalid UTF-8, duplicate/unknown fields, trailing JSON and explicit null fields/items; retained public-key text is NUL-free. Shared stateless Identity normalization rejects private/symmetric JOSE members and retains supported public JWK fields only; parsed RSA certificates exclude trailing PEM blocks. Authorized replay preserves normalized public PEM and harmless public group names without weakening generic privacy redaction. Invalid trust material does not replace current trust or append an audit. No live provider call is made; provider ownership and key custody are not proved. Historical records, receipts and backups are not scrubbed or repaired.","operationId":"updateSSOProviderTrustMaterial","parameters":[{"description":"SSO provider id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/UpdateSSOProviderTrustMaterialRequest"}}},"description":"SSO provider trust material update request.","required":true},"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SSOProviderEnvelope"}}},"description":"Updated SSO provider envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Update SSO provider trust material","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["identity:admin"]}},"/v1/sso/session-exchanges":{"post":{"description":"Exchanges a locally verified OIDC ID token or SAML assertion for an SSO session and Secure HttpOnly SameSite=Strict browser cookie. PostgreSQL reads bounded current provider, identity-link, user and grant projections without Ledger inventories; the write transaction rechecks those snapshots and commits verification, session and audits together before returning a secret or cookie. Only an active tenant-owned user with a verified identity link and current user or mapped provider-group grants can receive a session. Exactly one nonempty credential is required. Omitted or zero expiry defaults to eight hours; explicit expiry must be future and no more than twelve hours. Duplicate, null, unknown, non-object, invalid UTF-8 and NUL-bearing inputs are rejected. This public route is not an idempotency replay surface: repeated valid requests may issue new sessions, and no credential or secret enters a replay receipt. No live provider API or group synchronization call is made.","operationId":"exchangeSSOCredential","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ExchangeSSOCredentialRequest"}}},"description":"Strict object with non-null supplied fields. Provider ID is bounded at 1 KiB; subject and credential text at 64 KiB each, within the 64 KiB request-body limit.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SSOCredentialExchangeEnvelope"}}},"description":"Created SSO session, verification receipt, and one-time secret envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"summary":"Exchange SSO credential","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"supported"}},"/v1/sso/sessions":{"post":{"description":"Creates an administrator-issued human SSO session with current tenant-wide identity:admin authority, a tenant-owned active user and a tenant-owned provider. PostgreSQL uses a focused Identity transaction for session, actual-caller audit and safe replay completion. The first 201 response returns the bearer secret once; completed replay contains only original session metadata and never reissues a credential. This route verifies no provider credential, grants no additional roles and sets no browser cookie.","operationId":"createSSOSession","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateSSOSessionRequest"}}},"description":"All fields are required and non-null. User/provider IDs are trimmed, UTF-8/NUL-safe and at most 1 KiB each. Explicit expires_at must be in the future for new issuance, normalized to UTC microseconds; administrative issuance retains no upper lifetime cap. JSON must be one strict object without unknown or duplicate fields, trailing values or malformed UTF-8.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SSOSessionCreateEnvelope"}}},"description":"Created SSO session and one-time secret envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create SSO session","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["identity:admin"]}},"/v1/sso/sessions/{id}/revoke":{"post":{"description":"Revokes a current tenant-owned SSO session with tenant-wide identity:admin authority. PostgreSQL reads bounded, hash-free session metadata under a row lock and commits revocation, actual-caller audit and safe replay together without Ledger inventories. An expired session, inactive user/provider or missing parent does not prevent administrative invalidation. A new request for an already-revoked session conflicts; authorized completed replay returns the original safe metadata after current session ownership checks. Ambient session-cookie requests require a single HTTPS Origin matching request Host; bearer requests do not. Admin revocation sets no browser cookie.","operationId":"revokeSSOSession","parameters":[{"description":"SSO session id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EmptyObject"}}},"description":"Optional empty body or strict empty JSON object only, bounded at 64 KiB. Unknown/duplicate fields, null, malformed UTF-8 and trailing values are rejected. The trimmed session ID is NUL-free UTF-8 bounded at 1 KiB.","required":false},"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SSOSessionEnvelope"}}},"description":"Revoked SSO session envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Revoke SSO session","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["identity:admin"]}},"/v1/transparency-checkpoints":{"post":{"description":"Records an external transparency or timestamp checkpoint reference for a Merkle batch.","operationId":"createTransparencyCheckpoint","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateTransparencyCheckpointRequest"}}},"description":"Transparency checkpoint creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/TransparencyCheckpointEnvelope"}}},"description":"Created transparency checkpoint envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Record external transparency checkpoint","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["keys:admin"]}},"/v1/users":{"post":{"description":"Creates a tenant-scoped human user metadata record. Authentication is still controlled by API keys or configured SSO/session flows. PostgreSQL uses focused Identity commands with current tenant-wide human authority and current optional organization ownership. Email is trimmed/lowercased and must be a plain mailbox address; this does not verify ownership. The fixed public user DTO, including required email, survives authorized durable replay without broadening log or customer-package redaction.","operationId":"createUser","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateUserRequest"}}},"description":"Human user creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/HumanUserEnvelope"}}},"description":"Created human user envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create user","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["identity:admin"]}},"/v1/users/{id}/deactivate":{"post":{"description":"Deactivates a tenant-scoped human user as an audited lifecycle transition. PostgreSQL uses a bounded current-user projection with tenant-wide human authority and current organization ownership; status, audit and replay commit atomically. Committed deactivation invalidates current-user session authentication. A completed matching request replays the public DTO without another transition; a new transition of an inactive user conflicts.","operationId":"deactivateUser","parameters":[{"description":"Human user id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EmptyObject"}}},"description":"Empty JSON object.","required":true},"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/HumanUserEnvelope"}}},"description":"Deactivated human user envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Deactivate user","tags":["evydence"],"x-evydence-owner":"identity-access","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["identity:admin"]}},"/v1/verify":{"post":{"description":"Verifies one of nine supported tenant-scoped subject types using its existing assurance profile. PostgreSQL uses native durable execution, not Ledger replay. Current flat ownership and resource grants are checked before reservation and every replay; the common writer fence precedes share locks held through the outer commit. Audit-chain, Merkle, checkpoint, backup and artifact-signature profiles require tenant-wide human grants; evidence, attestation and release-bundle profiles retain their matching resource grants. Completed retries return the original receipt without re-reading changed payloads, manifests, digests, trust policies or prior verification metadata. The strict non-null JSON object is capped at 64 KiB, raw subject_type at 64 NUL-free UTF-8 bytes and raw subject_id at 1024 bytes before trimming. Only subject_type and subject_id are accepted; unknown, duplicate, case-aliased, malformed and non-object input is rejected. Audit-chain IDs must be absent or empty; other supported types require an ID. Cookie mutations require same-origin protection; bearer credentials take precedence. Fresh receipt, audit, verification job and successful replay commit atomically; failed HTTP inspection returns 422 and rolls back business effects. Explicit local memory remains nondurable. Historical delivery does not establish current trust validity, provider runtime integrity, artifact safety or compliance.","operationId":"verify","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VerifySubjectRequest"}}},"description":"Subject verification request.","required":true},"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VerificationResultEnvelope"}}},"description":"Subject verification envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Verify subject","tags":["evydence"],"x-evydence-stability":"core","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["verify:read"]}},"/v1/version":{"get":{"description":"Returns immutable build identity injected at build time: version, source commit, build time, dirty marker, Go version, and release-manifest digest.","operationId":"version","responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VersionInfoEnvelope"}}},"description":"Version information envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"summary":"Version","tags":["evydence"],"x-evydence-stability":"supported"}},"/v1/vex":{"post":{"description":"Uploads OpenVEX payload bytes and atomically records normalized VEX metadata, an accepted import report, and a versioned bounded decision request. Decision mapping always runs asynchronously after commit. When a durable object payload is available, the worker replays it and verifies that it matches the normalized request; otherwise the worker consumes the normalized request directly. Poll the import-report endpoint for parsed or failed status. Use application/vnd.openvex+json with the explicit metadata headers for streaming uploads up to 20 MiB; the JSON envelope remains limited to small requests. In PostgreSQL mode, a focused command checks current tenant-owned release parents and human release/artifact grants before parsing or staging. IDs are NUL-free UTF-8 bounded at 1024 bytes; wrapped JSON remains capped at 64 KiB and rejects null, duplicate, and unknown fields. Declared source size and SHA-256 are verified. Normalized projections are limited to 100,000 statements, 1 MiB per string, and 64 MiB combined projection strings; the versioned post-commit decision request permits at most 1,000,000 values and 20 MiB combined decision text. Overflow fails validation rather than truncating. VEX, accepted report, evidence, audit, payload metadata, outbox jobs, and idempotency completion commit together; decisions are never written during upload. Replay checks current grants without parsing or staging. Retained body-only native OpenVEX receipts require exact tenant, release, optional artifact, and format and never execute a new upload. Normalized VEX metadata and the accepted report are always retained, regardless of worker-owned parsing. Acceptance does not establish source authority, signature trust, or legal sufficiency.","operationId":"uploadVEX","parameters":[{"description":"Optional artifact id for a native OpenVEX document upload.","in":"header","name":"X-Evydence-Artifact-ID","required":false,"schema":{"minLength":1,"type":"string"}},{"description":"Required for a native OpenVEX document upload.","in":"header","name":"X-Evydence-Release-ID","required":false,"schema":{"minLength":1,"type":"string"}}],"requestBody":{"content":{"application/json":{"examples":{"openvex-fixed-decision":{"summary":"Upload OpenVEX for asynchronous decision mapping","value":{"artifact_id":"art_20260527120000","payload":{"@context":"https://openvex.dev/ns/v0.2.0","@id":"https://example.test/vex/payments-api/1.0.0","author":"security@example.test","statements":[{"action_statement":"Ship the fixed artifact after operator review.","impact_statement":"Patched before this release candidate.","justification":"fixed_in_release_candidate","products":[{"@id":"pkg:apk/openssl@3.1.0"}],"status":"fixed","vulnerability":{"name":"CVE-2026-0002"}}],"timestamp":"2026-05-27T12:00:00Z","version":1},"release_id":"rel_20260527120000"}}},"schema":{"$ref":"#/components/schemas/EvidenceUploadRequest"}},"application/vnd.openvex+json":{"schema":{"format":"binary","maxLength":20971520,"type":"string"}}},"description":"OpenVEX upload request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VEXDocumentEnvelope"}}},"description":"Created VEX document envelope