":"List control frameworks","tags":["evydence"],"x-evydence-stability":"experimental","x-scopes":["controls:read"]},"post":{"description":"Creates a tenant-scoped versioned control framework. PostgreSQL binds focused Risk commands and native durable replay, without Ledger cloning or inventories. Current tenant-wide controls:admin grants for human sessions and tenant existence are checked before every fresh request or replay; duplicate versions and installed metadata are not replay authority. Record, principal audit and replay result commit together without a job. Same-key replay preserves the original response; changed bytes or different-key duplicate slug/version return 409. Raw NUL-free UTF-8 name/description fields are bounded at 64 KiB, slug/version individually at 1024 bytes before trimming, with normalized slug plus version at 1024 bytes. An omitted/blank slug is derived from the name. Strict JSON and the 64 KiB body limit apply in both profiles. Cookie-authenticated writes require same-host HTTPS Origin; explicit bearer authentication takes precedence. Local memory retains compatibility storage and nondurable replay with the same tenant administration and input rules. Recording does not establish framework compliance.","operationId":"createControlFramework","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateControlFrameworkRequest"}}},"description":"Control framework creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ControlFrameworkEnvelope"}}},"description":"Created control framework envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"desc