"application/json":{"schema":{"$ref":"#/components/schemas/CollectorCreateEnvelope"}}},"description":"Created collector and one-time key secret envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create collector","tags":["evydence"],"x-evydence-owner":"integration-ingestion","x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["collector:admin"]}},"/v1/collectors/github/source-snapshots":{"post":{"description":"Records a strict GitHub source snapshot. PostgreSQL checks current project and repository ownership and commits all supplied source components and audit entries in one transaction. Repository and commit identities are reused, branches are current state, and each executed pull-request recording appends a new snapshot. Stores only the exact-byte message hash; omitted commit time defaults to server time. Optional components must be omitted rather than null. Request replay adds no effects. The provider label is submitted metadata and does not verify GitHub origin, signatures, or review authority. PostgreSQL HTTP uses native durable replay with a read-only current tenant/submitted/existing repository creation-scope guard before reservation and completed replay. The common writer fence and parent locks survive through the outer commit. The guard does not read private child metadata, call child writes or use clocks/IDs; it is not re-verification of historical children or current branch state. Raw nested input bounds are checked before trimming and before composed writes, within the 64 KiB HTTP envelope. Completed replay preserves original public JSON and request-byte fingerprints without reapplying old branches. Cookie writes require same-host HTTPS Origin; explicit bearer credentials take precedence. Local memory shares strict input and current-authority checks but retains nondurable map storage.","operationId":"uploadGitHubSourceSnapshot","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SourceSnapshotRequest"}}},"description":"GitHub source snapshot upload request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SourceSnapshotEnvelope"}}},"description":"Created source snapshot resources envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Upload GitHub source snapshot","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["source:write"]}},"/v1/collectors/gitlab/source-snapshots":{"post":{"description":"Records a strict GitLab source snapshot. PostgreSQL checks current project and repository ownership and commits all supplied source components and audit entries in one transaction. Repository and commit identities are reused, branches are current state, and each executed pull-request recording appends a new snapshot. Stores only the exact-byte message hash; omitted commit time defaults to server time. Optional components must be omitted rather than null. Request replay adds no effects. The provider label is submitted metadata and does not verify GitLab origin, signatures, or review authority. PostgreSQL HTTP uses native durable replay with a read-only current tenant/submitted/existing repository creation-scope guard before reservation and completed replay. The common writer fence and parent locks survive through the outer commit. The guard does not read private child metadata, call child writes or use clocks/IDs; it is not re-verification of historical children or current branch state. Raw nested input bounds are checked before trimming and before composed writes, within the 64 KiB HTTP envelope. Completed replay preserves original public JSON and request-byte fingerprints without reapplying old branches. Cookie writes require same-host HTTPS Origin; explicit bearer credentials take precedence. Local memory shares strict input and current-authority checks but retains nondurable map storage.","operationId":"uploadGitLabSourceSnapshot","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SourceSnapshotRequest"}}},"description":"GitLab source snapshot upload request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SourceSnapshotEnvelope"}}},"description":"Created source snapshot resources envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Upload GitLab source snapshot","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["source:write"]}},"/v1/collectors/{id}/health":{"get":{"description":"Returns collector supply-chain health from recorded tenant evidence, assumptions, and limitations. Production resolves the collector and its latest and pinned releases in one tenant-scoped database snapshot; human sessions require a tenant-wide collector:read grant.","operationId":"collectorHealthReport","parameters":[{"description":"Collector id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CollectorHealthReportEnvelope"}}},"description":"Collector health report envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Collector health report","ta