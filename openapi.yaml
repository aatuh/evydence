s":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ArtifactSignatureEnvelope"}}},"description":"Created artifact signature envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create artifact signature","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["evidence:write"]}},"/v1/artifact-signatures/{id}":{"get":{"description":"Returns artifact signature metadata by id only when the current tenant owns the signature and its artifact digest still matches. A human session additionally needs an evidence:read grant covering a current evidence or build association; issued credentials use their evidence:read scope.","operationId":"getArtifactSignature","parameters":[{"description":"Optional ETag from a prior private resource read. A match returns 304 without a response body.","in":"header","name":"If-None-Match","required":false,"schema":{"minLength":1,"type":"string"}},{"description":"Artifact signature id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ArtifactSignatureEnvelope"}}},"description":"Artifact signature envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Get artifact signature","tags":["evydence"],"x-evydence-conditional-read":{"cache_control":"private, max-age=0, must-revalidate","not_modified":304,"vary":"Authorization"},"x-evydence-stability":"experimental","x-scopes":["evidence:read"]}},"/v1/artifact-signatures/{id}/verify-cosign":{"post":{"description":"Cryptographically verifies a stored Sigstore/Cosign bundle against operator-configured trust material and caller-supplied keyless identity policy. The explicit offline profile requires an embedded Rekor inclusion proof and does not silently downgrade an online-required request. PostgreSQL uses native durable execution: current verify:read authority and flat tenant/signature/artifact ownership guards run before reservation and every replay; human sessions need a tenant-wide grant. The common writer fence precedes tenant, artifact and signature locks. Successful verification commits both receipts, audit and replay atomically. Completed replay returns the original receipt without reading current digests, images, payloads or trust material, or re-running verification. Both profiles require exact non-null policy fields within 64 KiB; signature IDs are capped at 1024 bytes and optional identity/issuer text at 4096 UTF-8 bytes before trimming. Fresh object reads retain the 4 MiB bound. Cookie mutations require same-origin protection; bearer credentials take precedence. Failed or unavailable inspection returns 422 without a success envelope or partial receipt commit. Local memory remains explicitly nondurable. A historical receipt is not proof of current trust validity, artifact safety, provenance completeness or legal compliance.","operationId":"verifyCosignSignature","parameters":[{"description":"Artifact signature id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VerifyCosignSignatureRequest"}}},"description":"Cosign policy verification request.","required":true},"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CosignVerificationEnvelope"}}},"description":"Cosign verification envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Verify cosign-style artifact signature","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["verify:read"]}},"/v1/artifacts":{"post":{"description":"Registers declared artifact metadata requiring evidence:write. PostgreSQL uses native durable execution without Ledger replay/refresh. Current tenant authority and existing digest ownership/grants run on every retry without private metadata, clocks or IDs; locks join the outer record/audit/replay transaction. Natural-key reuse returns original immutable metadata without another audit. Identical request bytes replay the original result, including exact integer sizes; changed bytes conflict. Both profiles require strict non-null exact JSON within 64 KiB; raw NUL-free UTF-8 names/media types are capped at 64 KiB and digest text at 128 bytes before trimming. Size is nonnegative and defaults to zero when omitted. Fresh reuse of oversized stored metadata returns 409. Cookie writes require same-host HTTPS Origin with Bearer precedence. Local memory remains nondurable. Registration does not verify uploaded bytes, signatures or provenance.","operationId":"registerArtifact","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/RegisterArtifactRequest"}}},"description":"Artifact registration request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ArtifactEnvelope"}}},"description":"Registered artifact envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Register artifact","tags":["evydence"],"x-evydence-owner":"release-catalog","x-evydence-stability":"core","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["evidence:write"]}},"/v1/artifacts/{id}":{"get":{"descriptio