lem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"summary":"Health","tags":["evydence"],"x-evydence-stability":"supported"}},"/v1/incident-webhooks/{receiver_id}":{"post":{"description":"Public incident timeline webhook: no bearer token or HTTP Idempotency-Key is required. PostgreSQL uses focused Operations commands and bounded tenant/receiver/event point reads. A single event-id, timestamp, and signature header is required. The Ed25519 signature covers UTC RFC3339 seconds, newline, trimmed event id, newline, and exact body bytes; timestamps must be within five minutes. Verification precedes payload parsing. Event-id retries with the same bytes return the original event/timeline, including after a fresh signature; changed bytes conflict. Current receiver status/key, incident parents, and linked evidence ownership are rechecked on replay. Evidence must belong to the incident product and, if release-scoped, its release. Event, timeline, and webhook-attributed audit commit together. JSON bodies are limited to 64 KiB and reject null/duplicate/unknown fields, NUL, and invalid UTF-8. IDs are capped at 1024 UTF-8 bytes; the tenant/receiver/event replay key is capped at 2304 combined bytes. New timestamps use UTC microsecond precision.","operationId":"receiveIncidentWebhook","parameters":[{"description":"Provider event id used for replay detection.","in":"header","name":"X-Evydence-Webhook-Event-ID","required":true,"schema":{"type":"string"}},{"description":"ed25519=\u003cbase64 signature\u003e over timestamp, event id, and raw body.","in":"header","name":"X-Evydence-Webhook-Signature","required":true,"schema":{"type":"string"}},{"description":"RFC3339 timestamp included in the signed payload.","in":"header","name":"X-Evydence-Webhook-Timestamp","required":true,"schema":{"type":"string"}},{"description":"Incident webhook receiver id.","in":"path","name":"receiver_id","required":true,"schema":{"type":"string"}}],"requestBody