axLength":4096,"minLength":1,"type":"string"}},{"description":"Sort direction for cursor pagination.","in":"query","name":"direction","required":false,"schema":{"default":"asc","enum":["asc","desc"],"type":"string"}},{"description":"Maximum records in this page. Defaults to 50 and is capped at 500.","in":"query","name":"page_size","required":false,"schema":{"default":50,"maximum":500,"minimum":1,"type":"integer"}},{"description":"Filter by product id.","in":"query","name":"product_id","required":false,"schema":{"type":"string"}},{"description":"Filter by questionnaire question id.","in":"query","name":"question_id","required":false,"schema":{"type":"string"}},{"description":"Filter by release id.","in":"query","name":"release_id","required":false,"schema":{"type":"string"}},{"description":"Stable sort key for cursor pagination.","in":"query","name":"sort","required":false,"schema":{"default":"created_at","enum":["created_at","id"],"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/QuestionnaireAnswerLibraryEntryListEnvelope"}}},"description":"Questionnaire answer library entry list envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"List questionnaire answer library entries","tags":["evydence"],"x-evydence-stability":"experimental","x-scopes":["package:read"]},"post":{"description":"Creates a reusable answer draft under package:write with at least one nonblank question/type/control selector and optional coherent product/release scope. Human sessions need a current matching tenant/product/release grant; unscoped entries require tenant-wide authority. Release parents are resolved for authorization only; raw product/release coordinates and exact stored-coordinate citation filtering remain unchanged. IDs/selectors are limited to 1024 raw UTF-8/NUL-free bytes, answers and each limitation to 64 KiB, citations to 4096, and limitations to 128. Aggregate input text, selected citation coordinates, and encoded output each have a 4 MiB budget; the complete HTTP body retains its 64 KiB limit. Citations and limitations are trimmed/sorted with duplicates preserved; blank limitations remain inert, and omitted/empty limitations use the existing human-review warning. PostgreSQL locks current tenant/root/control/framework/evidence parents after the worker/audit fence, selects no existing private answers or evidence payloads, and commits the answer, caller audit and body-keyed successful replay together. Replays recheck current root grants and all references. Both profiles reject null, duplicate, unknown or mixed-case fields, invalid UTF-8 and NUL. Cookie writes require one same-host HTTPS Origin; bearer credentials retain precedence. Historical response schemas remain unchanged. These entries are reusable drafts requiring human review, not evidence completeness, customer-package redaction or compliance conclusions.","operationId":"createQuestionnaireAnswerLibraryEntry","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateQuestionnaireAnswerLibraryEntryRequest"}}},"description":"Questionnaire answer library entry creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/QuestionnaireAnswerLibraryEntryEnvelope"}}},"description":"Created questionnaire answer library entry envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create questionnaire answer library entry","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["package:write"]}},"/v1/questionnaire-drafts":{"post":{"description":"Creates a technical questionnaire draft from a tenant-owned template and optional coherent product/release scope. Requires package:read and matching tenant/product/release grants for human sessions. Reusable answers are independently authorized before private text is read; tenant-wide answers require a tenant grant. Candidates are ranked by matching question/control/type and scope specificity, then newest timestamp and ID ascending. Stored product/release selection is preserved; release-only input does not implicitly include product-scoped library entries. Without an authorized answer, the draft cites matching evidence or states that none is recorded. Cited evidence must remain in the requested scope. PostgreSQL uses bounded selectors rather than full prompts/payloads, allows at most 512 questions and 4096 combined answer candidates plus 4096 combined citations, limits identifiers/selectors to 1024 bytes, answers and each limitation to 64 KiB, limitations to 128 per response, and selected metadata and the public draft each to 4 MiB. Overflow fails rather than truncates. Draft, caller-attributed audit and successful idempotency replay commit together. Replay rechecks current root authority and binds canonical credential scopes and human resource grants without reading private answer text. Changed permissions or older body-only draft fingerprints conflict with 409 when root access remains allowed; use a new key for a new draft. Null/duplicate/unknown fields and invalid UTF-8/NUL input are rejected. Cookie writes require one same-host HTTPS Origin; bearer credentials retain precedence. Local-memory mode retains compatibility storage with scoped answer/citation checks. These drafts require human review and do not provide compliance conclusions or customer-package redaction.","operationId":"createQuestionnaireDraft","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateQuestionnaireDraftRequest"}}},"description":"Questionnaire draft creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/QuestionnaireDraftEnvelope"}}},"description":"Created questionnaire draft envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create evidence-backed questionnaire draft","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["package:read"]}},"/v1/questionnaire-packages":{"post":{"description":"Creates an evidence-backed questionnaire response package under package:write from one tenant-owned template and optional coherent product/release selection. Human sessions require matching tenant/product/release grants for the selection; unscoped selection requires tenant-wide authority. Optional package_id is an independently authorized customer-package association, not an implicit filter, download, redaction or expiry/NDA acceptance operation. Explicit selection must agree with its current product/release parents. Reusable answers require independent package:write authority before private text is read. Response ranking, raw selection coordinates, response schema and normalized-JSON manifest hash remain unchanged. PostgreSQL uses focused Package commands and bounded question selectors, candidate scope metadata and citations, never template prompts, associated manifests or evidence payloads. Limits are 512 questions, 4096 combined answer candidates, 4096 combined citations, 1024-byte IDs/selectors, 64 KiB answers and each limitation, 128 limitations per response, and 4 MiB selected metadata and encoded output. Overflow fails rather than truncates. The worker/audit fence precedes root/template/package locks; package, caller audit and successful replay commit atomically. Replay checks current roots and association and binds canonical credential scopes and human grants; changed permissions or older body-only fingerprints return 409 when current access is still allowed. Use a new key for a new result. Both profiles reject null/duplicate/unknown/mixed-case fields, invalid UTF-8 and NUL; cookie writes require one same-host HTTPS Origin, with bearer precedence. Local memory retains explicit compatibility storage. Generated responses require human review and provide neither compliance conclusions nor customer-safe redaction.","operationId":"createQuestionnairePackage","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateQuestionnairePackageRequest"}}},"description":"Questionnaire package creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/QuestionnairePackageEnvelope"}}},"description":"Created questionnaire package envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create questionnaire package","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["package:write"]}},"/v1/questionnaire-templates":{"post":{"description":"Creates a tenant-wide questionnaire definition under package:write; human sessions require a current tenant-level grant. Questions retain input order and require unique trimmed IDs, nonblank prompts and current same-tenant control/framework references when supplied. Name, version, selectors and allowed fields are limited to 1024 raw UTF-8/NUL-free bytes; prompts to 64 KiB; question count to 512; allowed fields to 128 per question. Aggregate input text and the encoded template each have a 4 MiB budget. Allowed fields are inert metadata, trimmed/sorted with duplicates and blank strings preserved. PostgreSQL uses focused Package commands, locks only tenant and selected control/framework identities after the worker/audit fence, and commits template, caller audit and successful body-keyed idempotency replay together. Replays recheck current tenant-wide authority and referenced control ownership. Both profiles reject null/duplicate/unknown/mixed-case fields, invalid UTF-8 and NUL; cookie mutations require one same-host HTTPS Origin, with explicit bearer precedence. Historical templates and response schemas are unchanged; local memory retains its storage facade.","operationId":"createQuestionnaireTemplate","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CreateQuestionnaireTemplateRequest"}}},"description":"Questionnaire template creation request.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/QuestionnaireTemplateEnvelope"}}},"description":"Created questionnaire template envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Create questionnaire template","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["package:write"]}},"/v1/ready":{"get":{"description":"Runs bounded PostgreSQL, migration, writer-lease, object-store, and signing-configuration probes configured for this process. The public result contains no tenant data, credentials, paths, or raw dependency errors. An unavailable result includes typed dependency retry metadata and Retry-After.","operationId":"ready","responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReadinessStatusEnvelope"}}},"description":"Readiness status envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ReadinessStatus