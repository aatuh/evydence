dit inspection; changed request bytes conflict. Both profiles require an empty JSON object, reject unknown, duplicate, case-aliased, invalid UTF-8 and malformed input, and cap the body at 64 KiB. Unsafe cookie mutations require same-origin protection. Local memory remains nondurable with its distinct v1 whole-state hash. Credential material, replay bookkeeping and raw object payload bytes are excluded. Failed audit observations remain failed, and local checks do not prove external anchoring.","operationId":"generateBackupManifest","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EmptyObject"}}},"description":"Empty JSON object.","required":true},"responses":{"201":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BackupManifestEnvelope"}}},"description":"Backup manifest envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Generate backup manifest","tags":["evydence"],"x-evydence-stability":"experimental","x-idempotency-key":{"header":"Idempotency-Key","required":true},"x-scopes":["admin"]}},"/v1/backup-manifests/{id}/verify":{"get":{"description":"Verifies a tenant-scoped backup manifest and returns deterministic manifest verification checks.","operationId":"verifyBackupManifest","parameters":[{"description":"Backup manifest id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VerificationResultEnvelope"}}},"description":"Backup manifest verification envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Service Unavailable"}},"security":[{"BearerAuth":[]}],"summary":"Verify backup manifest","tags":["evydence"],"x-evydence-stability":"experimental","x-scopes":["verify:read"]}},"/v1/build-attestations/{id}/verify-signature":{"post":{"description":"Offline-verifies DSSE PAE, an in-toto Statement v1/SLSA provenance v1 predicate, registered release-artifact subject digests, and immutable configured tenant-root policy. Requires verify:read and current owned attestation/evidence/build/project/release/product coordinates; human sessions need a matching tenant, product, project or release grant. PostgreSQL uses native durable execution without Ledger replay. Current flat ownership and grants run before reservation and every replay, with the common writer fence before row locks held through receipt/audit/job/replay commit. Completed retries return the original receipt without reading changed payloads, trust policies or build outputs. The required empty JSON object is capped at 64 KiB; raw NUL-free UTF-8 IDs at 1024 bytes before trimming. Malformed, missing, unknown, duplicate and non-object input fails validation. Cookie mutations require same-origin protection; bearer credentials take precedence. Fresh metadata is bounded to 4096 records and 8 MiB, and finalized payload reads to 8 MiB. Failed HTTP inspection returns 422 and rolls back business effects; unavailable trust can return a conservative not_verified receipt with 200. Local memory remains explicitly nondurable. This receipt does not prove current trust validity, provenance completeness, CI-provider runtime integrity or compliance.","operationId":"verifyBuildAttestationSignature","parameters":[{"description":"Build attestation id.","in":"path","name":"id","required":true,"schema":{"type":"string"}}],"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EmptyObject"}}},"description":"Empty JSON object.","required":true},"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VerificationResultEnvelope"}}},"description":"Build attestation verification envelope."},"400":{"content":{"application/pro