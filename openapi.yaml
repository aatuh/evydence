":"query","name":"direction","required":false,"schema":{"default":"asc","enum":["asc","desc"],"type":"string"}},{"description":"Maximum records in this page. Defaults to 50 and is capped at 500.","in":"query","name":"page_size","required":false,"schema":{"default":50,"maximum":500,"minimum":1,"type":"integer"}},{"description":"Filter by release id.","in":"query","name":"release_id","required":false,"schema":{"type":"string"}},{"description":"Stable sort key for cursor pagination.","in":"query","name":"sort","required":false,"schema":{"default":"created_at","enum":["created_at","id"],"type":"string"}},{"description":"Filter by evidence type.","in":"query","name":"type","required":false,"schema":{"type":"string"}}],"responses":{"200":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/EvidenceItemListEnvelope"}}},"description":"Evidence item list envelope."},"400":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Bad Request"},"401":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unauthorized"},"403":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Forbidden"},"404":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Not Found"},"409":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Conflict"},"422":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Unprocessable Entity"},"429":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Too Many Requests"},"500":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/Problem"}}},"description":"Internal Server Error"},"503":{"content":{"application/problem+json":{"schema":{"$ref":"#/components/schemas/