<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evydence Package Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #5e6878;
      --line: #d8dee8;
      --accent: #1f6feb;
      --ok: #0f7b4f;
      --warn: #b7791f;
      --bad: #b42318;
      --soft: #eef4ff;
      --soft-warn: #fff8e6;
      --soft-bad: #fff1f0;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    header {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 8px 0 18px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 20px;
      letter-spacing: 0;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 15px;
      letter-spacing: 0;
    }
    p {
      margin: 0;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    input[type="file"] {
      min-height: 40px;
      max-width: 100%;
      color: var(--ink);
    }
    button {
      min-height: 40px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      padding: 8px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      min-height: 28px;
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--soft);
      color: #174ea6;
      font-size: 13px;
      font-weight: 700;
    }
    .muted {
      color: var(--muted);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 26px;
      margin-top: 24px;
    }
    .dossier {
      margin-top: 22px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }
    .dossier-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }
    .metric {
      min-height: 92px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 14px;
    }
    .metric.ok {
      border-color: rgba(15, 123, 79, 0.35);
      background: #effaf5;
    }
    .metric.warn {
      border-color: rgba(183, 121, 31, 0.35);
      background: var(--soft-warn);
    }
    .metric.bad {
      border-color: rgba(180, 35, 24, 0.35);
      background: var(--soft-bad);
    }
    .label {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .value {
      margin: 0;
      overflow-wrap: anywhere;
      font-weight: 750;
    }
    .section {
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .badge-row,
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .badge,
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 4px 9px;
      background: var(--soft);
      color: #174ea6;
      font-size: 12px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .badge.ok {
      background: #e7f7ef;
      color: var(--ok);
    }
    .badge.warn {
      background: var(--soft-warn);
      color: #8a5b10;
    }
    .badge.bad {
      background: var(--soft-bad);
      color: var(--bad);
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
      font-size: 14px;
    }
    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    tr:last-child td {
      border-bottom: 0;
    }
    .split {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .note {
      border-left: 4px solid var(--warn);
      padding: 10px 12px;
      background: var(--soft-warn);
      color: #6f4b12;
    }
    .command {
      display: block;
      overflow-x: auto;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #101418;
      color: #f7fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      white-space: pre;
    }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 14px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
    }
    pre {
      overflow: auto;
      max-height: 520px;
      margin: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101418;
      color: #f7fafc;
      font-size: 13px;
    }
    @media (min-width: 900px) {
      header {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
      }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101418;
        --surface: #171d26;
        --ink: #f7fafc;
        --muted: #a7b0bd;
        --line: #303846;
        --soft: #182842;
        --soft-warn: #2b2110;
        --soft-bad: #2b1715;
      }
      input[type="file"] {
        color: var(--ink);
      }
      .metric.ok {
        background: #10251d;
      }
      .empty {
        background: rgba(23, 29, 38, 0.62);
      }
      .note {
        color: #f5d58a;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Evydence Package Viewer</h1>
        <p class="muted">Local review surface for release evidence packages.</p>
      </div>
      <div class="controls">
        <input id="file" type="file" accept="application/json,.json">
        <button id="demo" type="button">Load bundled demo</button>
        <span id="status" class="status">No file loaded</span>
      </div>
    </header>

    <section id="summary" class="summary-grid" aria-live="polite"></section>
    <section id="dossier" class="dossier" aria-live="polite"></section>

    <div class="layout">
      <section id="release" class="section"></section>
      <section id="artifacts" class="section"></section>
      <section id="sbom" class="section"></section>
      <section id="risk" class="section"></section>
      <section id="approvals" class="section"></section>
      <section id="readiness" class="section"></section>
      <section id="contents" class="section"></section>
      <section id="proof" class="section"></section>
      <section id="verification" class="section"></section>
      <section id="limitations" class="section"></section>
      <section id="raw" class="section"></section>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById("file");
    const demoButton = document.getElementById("demo");
    const statusNode = document.getElementById("status");
    const summaryNode = document.getElementById("summary");
    const nodes = {
      dossier: document.getElementById("dossier"),
      release: document.getElementById("release"),
      artifacts: document.getElementById("artifacts"),
      sbom: document.getElementById("sbom"),
      risk: document.getElementById("risk"),
      approvals: document.getElementById("approvals"),
      readiness: document.getElementById("readiness"),
      contents: document.getElementById("contents"),
      proof: document.getElementById("proof"),
      verification: document.getElementById("verification"),
      limitations: document.getElementById("limitations"),
      raw: document.getElementById("raw")
    };

    const bundledDemo = {
      schema_version: "customer-security-package.v2.0.0",
      package_version: "customer-security-package.v2.0.0",
      package_id: "csp_example",
      id: "csp_example",
      title: "Example customer review package",
      generated_at: "2026-05-27T12:00:00Z",
      tenant: { id: "ten_example", name: "Example Tenant" },
      product: { id: "prod_example", name: "Payments API", slug: "payments-api" },
      product_id: "prod_example",
      release: { id: "rel_example", version: "1.0.0", state: "approved", created_at: "2026-05-27T12:00:00Z" },
      release_id: "rel_example",
      redaction_profile_id: "rp_example",
      redaction_profile: {
        id: "rp_example",
        name: "customer_safe",
        allowed_types: ["artifact", "sbom", "vulnerability_scan", "vex", "vulnerability_decision", "release_bundle"],
        excluded_fields: ["internal_notes", "payload_ref", "object_key"],
        schema_version: "redaction-profile.v1.0.0"
      },
      evidence_ids: ["ev_sbom", "ev_scan", "ev_vex"],
      artifact_digests: [
        { id: "art_example", name: "payments-api.tar.gz", media_type: "application/gzip", size: 123, digest: "sha256:ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb" }
      ],
      sboms: [
        { id: "sbom_example", evidence_id: "ev_sbom", format: "cyclonedx", spec_version: "1.6", component_count: 42 }
      ],
      vulnerability_scans: [
        {
          id: "scan_example",
          scanner: "example-scanner",
          target_ref: "pkg:oci/payments-api",
          finding_count: 1,
          summary: { critical: 0, high: 1 },
          findings: [{ id: "finding_example", vulnerability: "CVE-2026-0002", component: "pkg:apk/openssl@3.1.0", severity: "high", state: "fixed_by_decision" }]
        }
      ],
      vex_documents: [
        { id: "vex_example", format: "openvex", author: "security@example.test", statement_count: 1, status_summary: { fixed: 1 } }
      ],
      vulnerability_decisions: [
        { id: "vd_example", vulnerability: "CVE-2026-0002", component: "pkg:apk/openssl@3.1.0", sbom_id: "sbom_example", sbom_component_purl: "pkg:apk/openssl@3.1.0", sbom_component_name: "openssl", status: "fixed", source: "vex", impact_statement: "The finding is fixed in this release artifact.", action_statement: "Upgrade to this release after normal operator review.", reviewed_at: "2026-05-27T12:00:00Z", review_due_at: "2026-08-25T12:00:00Z", supporting_refs: [{ type: "exception", id: "exc_example" }, { type: "release_bundle", id: "bundle_example" }] }
      ],
      customer_decision_export: { file: "vulnerability-decisions.json", schema_version: "customer-vulnerability-decisions.v1.0.0", decision_count: 1, scope: "package" },
      approvals: [{ id: "appr_example", subject_type: "release", decision: "approved", reason: "Release evidence package reviewed." }],
      exceptions: [],
      readiness_summary: {
        result: "passed",
        checks: [
          { name: "release_requires_sbom", result: "passed", severity: "high", explanation: "SBOM evidence exists." },
          { name: "release_requires_build_attestation", result: "missing", severity: "medium", missing: ["build_attestation"], explanation: "Customer-safe package omits internal provenance by profile." }
        ],
        gaps: ["build_attestation"],
        limitations: ["Readiness is derived from recorded package-scope evidence only."]
      },
      verification_material: {
        hash_algorithm: "sha256",
        canonicalization: "canonicalization-profile.v1.0.0",
        manifest_hash_field: "manifest_hash",
        release_bundles: [{ id: "rb_example", state: "generated", manifest_hash: "sha256:example", signature_refs: ["sig_example"] }],
        audit_chain: { result: "passed", latest_sequence: 12, head_hash: "sha256:example" }
      },
      reviewer_checklist: [
        { id: "package_scope", label: "Package scope", status: "included", detail: "Scoped to product prod_example, release rel_example, redaction profile rp_example, and package csp_example." },
        { id: "included_evidence", label: "Included evidence", status: "included", detail: "Includes artifact digest, SBOM metadata, vulnerability scan summary, OpenVEX metadata, active customer-visible decision, release bundle metadata, and audit-chain summary." },
        { id: "excluded_evidence", label: "Excluded evidence", status: "documented", detail: "Excludes raw tenant evidence bytes, storage references, bearer credentials, signing material, API key hashes, SSO or session hashes, and internal decision notes." },
        { id: "hash_signature_verification", label: "Hash and signature verification", status: "available", detail: "Verify the package archive or manifest hash with evydence package verify, then inspect release bundle and audit-chain verification material." },
        { id: "non_claims", label: "Non-claims", status: "documented", detail: "The package supports technical evidence review and compliance readiness only; it is not legal compliance proof, certification, complete SBOM proof, an authoritative vulnerability result, or a secure-release guarantee." },
        { id: "escalation_path", label: "Escalation path", status: "documented", detail: "Ask the package owner for missing release-specific evidence, a regenerated package with a broader approved redaction profile, or deployment-specific assumptions." }
      ],
      limitations: [
        "Package contents are scoped by product, release, redaction profile, and package expiry.",
        "Raw tenant evidence payload bytes, object-store payload references, bearer tokens, private keys, API key hashes, SSO/session token hashes, and internal decision notes are not included.",
        "Package data reflects records present in this Evydence instance at generation time."
      ],
      non_claims: [
        "This package supports technical evidence review and compliance readiness only.",
        "It is not legal compliance proof, certification, complete SBOM proof, an authoritative vulnerability result, regulator acceptance, or a secure-release guarantee."
      ]
    };

    const safeArray = (value) => Array.isArray(value) ? value : [];
    const safeObject = (value) => value && typeof value === "object" && !Array.isArray(value) ? value : {};
    const text = (value, fallback = "not present") => {
      if (value === undefined || value === null || value === "") {
        return fallback;
      }
      if (Array.isArray(value)) {
        return value.length ? value.join(", ") : fallback;
      }
      if (typeof value === "object") {
        return JSON.stringify(value);
      }
      return String(value);
    };
    const formatRefs = (refs) => {
      const values = safeArray(refs).map((ref) => {
        if (!ref || typeof ref !== "object") {
          return "";
        }
        return [ref.type, ref.id].filter(Boolean).join(":");
      }).filter(Boolean);
      return values.length ? values.join(", ") : "not present";
    };
    const firstRecord = (rows) => safeArray(rows).find((row) => row && typeof row === "object") || {};
    const joinRecordIDs = (rows) => {
      const ids = safeArray(rows).map((row) => {
        if (!row || typeof row !== "object") {
          return "";
        }
        return row.id || row.evidence_id || row.manifest_hash || "";
      }).filter(Boolean);
      return ids.length ? ids.join(", ") : "not present";
    };
    const pick = (obj, paths) => {
      for (const path of paths) {
        const value = path.split(".").reduce((current, key) => {
          if (current && Object.prototype.hasOwnProperty.call(current, key)) {
            return current[key];
          }
          return undefined;
        }, obj);
        if (value !== undefined && value !== null && value !== "") {
          return value;
        }
      }
      return "";
    };
    const resultTone = (result) => {
      const normalized = String(result || "").toLowerCase();
      if (["passed", "satisfied", "approved", "fixed", "not_affected", "verified"].includes(normalized)) {
        return "ok";
      }
      if (["failed", "blocked", "critical", "affected"].includes(normalized)) {
        return "bad";
      }
      if (["missing", "partial", "unknown", "under_investigation"].includes(normalized)) {
        return "warn";
      }
      return "";
    };
    const clearNode = (node) => {
      node.replaceChildren();
    };
    const appendText = (parent, tagName, className, value) => {
      const child = document.createElement(tagName);
      if (className) {
        child.className = className;
      }
      child.textContent = text(value);
      parent.append(child);
      return child;
    };
    const addMetric = (label, value, tone = "") => {
      const panel = document.createElement("section");
      panel.className = ["metric", tone].filter(Boolean).join(" ");
      appendText(panel, "p", "label", label);
      appendText(panel, "p", "value", value);
      summaryNode.append(panel);
    };
    const sectionHead = (node, title, meta = "") => {
      clearNode(node);
      const head = document.createElement("div");
      head.className = "section-head";
      appendText(head, "h2", "", title);
      if (meta) {
        appendText(head, "span", "badge", meta);
      }
      node.append(head);
    };
    const emptyState = (node, message) => {
      appendText(node, "p", "empty", message);
    };
    const tagList = (node, values) => {
      const list = document.createElement("div");
      list.className = "tag-list";
      safeArray(values).forEach((value) => appendText(list, "span", "tag", value));
      if (!list.childNodes.length) {
        appendText(list, "span", "tag", "not present");
      }
      node.append(list);
    };
    const table = (node, columns, rows, emptyMessage) => {
      if (!safeArray(rows).length) {
        emptyState(node, emptyMessage);
        return;
      }
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      const tableNode = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      columns.forEach((column) => appendText(headRow, "th", "", column.label));
      thead.append(headRow);
      const tbody = document.createElement("tbody");
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        columns.forEach((column) => {
          const td = document.createElement("td");
          const value = typeof column.value === "function" ? column.value(row) : row[column.value];
          if (column.badge) {
            const badge = appendText(td, "span", "badge " + resultTone(value), value);
            badge.setAttribute("aria-label", column.label + ": " + text(value));
          } else {
            td.textContent = text(value);
          }
          tr.append(td);
        });
        tbody.append(tr);
      });
      tableNode.append(thead, tbody);
      wrap.append(tableNode);
      node.append(wrap);
    };
    const normalizeData = (parsed) => parsed && (parsed.data || parsed.manifest || parsed);

    const renderSummary = (data, fileName) => {
      summaryNode.replaceChildren();
      addMetric("File", fileName);
      addMetric("Package", pick(data, ["title", "package_id", "id"]));
      addMetric("Readiness", pick(data, ["readiness_summary.result", "result", "status", "state"]), resultTone(pick(data, ["readiness_summary.result", "result", "status", "state"])));
      addMetric("Profile", pick(data, ["redaction_profile.name", "redaction_profile_id"]));
      addMetric("Evidence IDs", safeArray(data.evidence_ids).length);
      addMetric("Generated", pick(data, ["generated_at", "created_at", "checked_at"]));
    };

    const renderDossier = (data) => {
      clearNode(nodes.dossier);
      const packageID = pick(data, ["package_id", "id"]);
      const productID = pick(data, ["product.id", "product_id"]);
      const releaseID = pick(data, ["release.id", "release_id"]);
      const sbom = firstRecord(data.sboms);
      const decision = firstRecord(data.vulnerability_decisions);
      const approval = firstRecord(data.approvals);
      const material = safeObject(data.verification_material);
      const audit = safeObject(material.audit_chain);
      const releaseBundles = safeArray(material.release_bundles);
      const verificationStatus = material.hash_algorithm
        ? "Verification material present; run CLI verifier before relying on bytes."
        : "No package verification material is present.";
      const approver = approval.approver || approval.approved_by || approval.actor || approval.reviewer || approval.decision || "not present";
      const command = [
        "evydence package verify \\",
        "  --manifest package-manifest.json \\",
        "  --expected-package-id " + text(packageID, "<package_id>") + " \\",
        "  --expected-product-id " + text(productID, "<product_id>") + " \\",
        "  --expected-release-id " + text(releaseID, "<release_id>")
      ].join("\n");

      const head = document.createElement("div");
      head.className = "section-head";
      appendText(head, "h2", "", "Reviewer Dossier");
      appendText(head, "span", "badge warn", "read-only package scope");
      nodes.dossier.append(head);

      const grid = document.createElement("div");
      grid.className = "dossier-grid";
      [
        ["Scope", [text(data.product && data.product.name, productID), text(data.release && data.release.version, releaseID), text(data.redaction_profile && data.redaction_profile.name, data.redaction_profile_id)].join(" / ")],
        ["Package verification result", verificationStatus],
        ["SBOM summary", [text(sbom.format), text(sbom.component_count, "0") + " components"].join(" / ")],
        ["CVE decision", [text(decision.vulnerability), text(decision.status)].join(" / ")],
        ["Approver / approval", approver],
        ["Linked evidence", [safeArray(data.evidence_ids).length + " evidence IDs", releaseBundles.length + " release bundles", text(audit.result)].join(" / ")],
        ["Limitations", safeArray(data.limitations).length + safeArray(data.non_claims).length + " listed"],
        ["Package expiry", pick(data, ["expires_at", "expires", "valid_until"])]
      ].forEach(([label, value]) => {
        const card = document.createElement("section");
        card.className = "metric";
        appendText(card, "p", "label", label);
        appendText(card, "p", "value", value);
        grid.append(card);
      });
      nodes.dossier.append(grid);

      const linked = document.createElement("div");
      linked.className = "split";
      const left = document.createElement("div");
      appendText(left, "h3", "", "Linked evidence path");
      table(left, [
        { label: "Kind", value: "kind" },
        { label: "Included IDs", value: "ids" }
      ], [
        { kind: "Evidence records", ids: safeArray(data.evidence_ids).join(", ") },
        { kind: "Release bundles", ids: joinRecordIDs(releaseBundles) },
        { kind: "Decision support", ids: formatRefs(decision.supporting_refs) },
        { kind: "Redaction profile", ids: [data.redaction_profile_id, data.redaction_profile && data.redaction_profile.name].filter(Boolean).join(" / ") }
      ], "No linked package evidence is present.");
      const right = document.createElement("div");
      appendText(right, "h3", "", "Offline verification instructions");
      appendText(right, "p", "muted", "The browser view is read-only orientation. Verify the manifest or ZIP locally before relying on package bytes.");
      const code = document.createElement("code");
      code.className = "command";
      code.textContent = command;
      right.append(code);
      linked.append(left, right);
      nodes.dossier.append(linked);

      const boundary = document.createElement("p");
      boundary.className = "note";
      boundary.textContent = "This viewer renders only package-scoped JSON already present in the selected file. It is not an authorization layer, does not fetch tenant data, and does not expose raw evidence payload bytes or secrets.";
      nodes.dossier.append(boundary);
    };

    const renderRelease = (data) => {
      sectionHead(nodes.release, "Release Summary", data.schema_version || "");
      const grid = document.createElement("div");
      grid.className = "summary-grid";
      const release = safeObject(data.release);
      [
        ["Product", pick(data, ["product.name", "product_id"])],
        ["Release", pick(data, ["release.version", "release_id"])],
        ["Release state", pick(data, ["release.state", "state"])],
        ["Tenant", pick(data, ["tenant.name", "tenant.id"])],
        ["Package ID", pick(data, ["package_id", "id"])],
        ["Generated", data.generated_at]
      ].forEach(([label, value]) => {
        const card = document.createElement("section");
        card.className = "metric";
        appendText(card, "p", "label", label);
        appendText(card, "p", "value", value);
        grid.append(card);
      });
      if (!Object.keys(release).length) {
        emptyState(nodes.release, "No release metadata is present.");
      }
      nodes.release.append(grid);
    };

    const renderArtifactsAndSBOM = (data) => {
      sectionHead(nodes.artifacts, "Artifact Summary", String(safeArray(data.artifact_digests).length) + " artifact records");
      table(nodes.artifacts, [
        { label: "Artifact", value: (row) => row.name || row.id },
        { label: "Digest", value: "digest" },
        { label: "Media type", value: "media_type" },
        { label: "Size", value: "size" }
      ], data.artifact_digests, "No artifact digest records are present.");

      sectionHead(nodes.sbom, "SBOM Summary", String(safeArray(data.sboms).length) + " SBOM records");
      table(nodes.sbom, [
        { label: "SBOM", value: (row) => row.id || row.evidence_id },
        { label: "Format", value: "format" },
        { label: "Spec", value: "spec_version" },
        { label: "Components", value: "component_count" }
      ], data.sboms, "No SBOM metadata is present.");
    };

    const renderRisk = (data) => {
      const decisions = safeArray(data.vulnerability_decisions);
      const decisionExport = safeObject(data.customer_decision_export);
      const vexDocs = safeArray(data.vex_documents);
      const scans = safeArray(data.vulnerability_scans);
      const findings = safeArray(data.vulnerability_findings).concat(scans.flatMap((scan) => safeArray(scan.findings)));
      sectionHead(nodes.risk, "Vulnerability / VEX Decisions", String(decisions.length) + " active decisions");
      if (Object.keys(decisionExport).length) {
        const exportNote = document.createElement("p");
        exportNote.className = "muted";
        exportNote.textContent = "Package decision export: " + text(decisionExport.file) + " (" + text(decisionExport.schema_version) + ")";
        nodes.risk.append(exportNote);
      }
      const split = document.createElement("div");
      split.className = "split";
      const scanNode = document.createElement("div");
      appendText(scanNode, "h3", "", "Scan summary");
      table(scanNode, [
        { label: "Scanner", value: "scanner" },
        { label: "Target", value: "target_ref" },
        { label: "Findings", value: "finding_count" },
        { label: "Summary", value: (row) => row.summary || "" }
      ], scans, "No vulnerability scan metadata is present.");
      const vexNode = document.createElement("div");
      appendText(vexNode, "h3", "", "VEX documents");
      table(vexNode, [
        { label: "Document", value: (row) => row.id || row.evidence_id },
        { label: "Format", value: "format" },
        { label: "Author", value: "author" },
        { label: "Statements", value: "statement_count" }
      ], vexDocs, "No VEX document metadata is present.");
      split.append(scanNode, vexNode);
      nodes.risk.append(split);
      appendText(nodes.risk, "h3", "", "Vulnerability findings");
      table(nodes.risk, [
        { label: "Finding", value: (row) => row.id || row.vulnerability },
        { label: "Vulnerability", value: "vulnerability" },
        { label: "Component", value: "component" },
        { label: "Severity", value: "severity", badge: true },
        { label: "State", value: "state", badge: true }
      ], findings, "No customer-visible finding summaries are present.");
      appendText(nodes.risk, "h3", "", "Active decisions");
      table(nodes.risk, [
        { label: "Vulnerability", value: "vulnerability" },
        { label: "Component", value: "component" },
        { label: "SBOM", value: "sbom_id" },
        { label: "SBOM PURL", value: "sbom_component_purl" },
        { label: "Status", value: "status", badge: true },
        { label: "Source", value: "source" },
        { label: "Reviewed", value: "reviewed_at" },
        { label: "Review due", value: "review_due_at" },
        { label: "Supporting links", value: (row) => formatRefs(row.supporting_refs) },
        { label: "Impact", value: "impact_statement" },
        { label: "Action", value: "action_statement" }
      ], decisions, "No active customer-visible decisions are present.");
    };

    const renderApprovals = (data) => {
      sectionHead(nodes.approvals, "Approvals And Exceptions");
      const split = document.createElement("div");
      split.className = "split";
      const approvals = document.createElement("div");
      appendText(approvals, "h3", "", "Approvals");
      table(approvals, [
        { label: "Subject", value: (row) => [row.subject_type, row.subject_id].filter(Boolean).join(": ") },
        { label: "Decision", value: "decision", badge: true },
        { label: "Reason", value: "reason" }
      ], data.approvals, "No approval records are present.");
      const exceptions = document.createElement("div");
      appendText(exceptions, "h3", "", "Exceptions / waivers");
      table(exceptions, [
        { label: "Scope", value: (row) => [row.scope_type, row.scope_id].filter(Boolean).join(": ") || row.id },
        { label: "State", value: (row) => row.approved === true ? "approved" : row.state, badge: true },
        { label: "Expiry", value: "expires_at" },
        { label: "Reason", value: "reason" }
      ], safeArray(data.exceptions).concat(safeArray(data.waivers)), "No approved exceptions or waivers are present.");
      split.append(approvals, exceptions);
      nodes.approvals.append(split);
    };

    const renderReadiness = (data) => {
      const summary = safeObject(data.readiness_summary);
      const checks = safeArray(summary.checks);
      sectionHead(nodes.readiness, "Readiness Gaps", summary.result || "not present");
      table(nodes.readiness, [
        { label: "Check", value: "name" },
        { label: "Result", value: "result", badge: true },
        { label: "Severity", value: "severity" },
        { label: "Missing", value: (row) => safeArray(row.missing).join(", ") },
        { label: "Explanation", value: "explanation" }
      ], checks, "No readiness checks are present.");
      const gaps = safeArray(summary.gaps);
      appendText(nodes.readiness, "h3", "", "Gaps");
      tagList(nodes.readiness, gaps);
      appendText(nodes.readiness, "h3", "", "Customer-safe gaps");
      table(nodes.readiness, [
        { label: "Evidence", value: "evidence_type" },
        { label: "Severity", value: "severity", badge: true },
        { label: "Summary", value: "summary" },
        { label: "Remediation", value: "remediation" }
      ], data.customer_safe_gaps, "No customer-safe package gaps are present.");
    };

    const renderContents = (data) => {
      sectionHead(nodes.contents, "What Is Included / Excluded");
      const profile = safeObject(data.redaction_profile);
      const split = document.createElement("div");
      split.className = "split";
      const included = document.createElement("div");
      appendText(included, "h3", "", "Included evidence types");
      tagList(included, profile.allowed_types);
      const excluded = document.createElement("div");
      appendText(excluded, "h3", "", "Excluded fields");
      tagList(excluded, profile.excluded_fields);
      split.append(included, excluded);
      nodes.contents.append(split);
      const profileName = String(profile.name || "");
      const provenancePresent = Boolean(data.provenance);
      const boundary = document.createElement("p");
      boundary.className = "note";
      boundary.textContent = profileName.includes("customer") || !provenancePresent
        ? "Customer-safe view: internal-only payloads, object references, and internal notes are not shown unless explicitly included by the package profile."
        : "Security-review view: broader technical metadata may be present, but raw payloads and secrets remain excluded by package policy.";
      nodes.contents.append(boundary);
      appendText(nodes.contents, "h3", "", "Reviewer checklist");
      table(nodes.contents, [
        { label: "Check", value: (row) => row.label || row.id },
        { label: "Status", value: "status", badge: true },
        { label: "Detail", value: "detail" }
      ], data.reviewer_checklist, "No reviewer checklist is present.");
    };

    const verificationResultLabel = (data) => {
      const material = safeObject(data.verification_material);
      const releaseBundles = safeArray(material.release_bundles);
      const audit = safeObject(material.audit_chain);
      if (releaseBundles.length && String(audit.result || "").toLowerCase() === "passed") {
        return "release bundle and audit-chain material present";
      }
      if (releaseBundles.length) {
        return "release bundle material present";
      }
      if (material.hash_algorithm || material.canonicalization) {
        return "package verification material present";
      }
      return "verification material not present";
    };

    const linkStatus = (record, field = "evidence_id") => {
      if (!record || typeof record !== "object") {
        return "not present";
      }
      return record[field] || record.id || record.manifest_hash ? "linked" : "missing link";
    };

    const renderProof = (data) => {
      sectionHead(nodes.proof, "Manifest Summary And Proof", verificationResultLabel(data));
      const material = safeObject(data.verification_material);
      const releaseBundles = safeArray(material.release_bundles);
      const audit = safeObject(material.audit_chain);
      const decisionExport = safeObject(data.customer_decision_export);

      const manifestGrid = document.createElement("div");
      manifestGrid.className = "summary-grid";
      [
        ["Schema", pick(data, ["schema_version", "package_version"])],
        ["Package ID", pick(data, ["package_id", "id"])],
        ["Product / release", [pick(data, ["product.id", "product_id"]), pick(data, ["release.id", "release_id"])].filter(Boolean).join(" / ")],
        ["Redaction profile", [data.redaction_profile_id, data.redaction_profile && data.redaction_profile.name].filter(Boolean).join(" / ")],
        ["Generated", pick(data, ["generated_at", "created_at"])],
        ["Manifest hash", pick(data, ["manifest_hash", "package_metadata.manifest_hash", "verification.manifest_hash", "verification_material.manifest_hash"]) || text(material.manifest_hash_field)]
      ].forEach(([label, value]) => {
        const card = document.createElement("section");
        card.className = "metric";
        appendText(card, "p", "label", label);
        appendText(card, "p", "value", value);
        manifestGrid.append(card);
      });
      nodes.proof.append(manifestGrid);

      appendText(nodes.proof, "h3", "", "Evidence Link Status");
      table(nodes.proof, [
        { label: "Evidence family", value: "family" },
        { label: "Records", value: "count" },
        { label: "Link status", value: "status", badge: true },
        { label: "Reference", value: "reference" }
      ], [
        { family: "Artifact digests", count: safeArray(data.artifact_digests).length, status: safeArray(data.artifact_digests).length ? "linked" : "missing", reference: joinRecordIDs(data.artifact_digests) },
        { family: "SBOM", count: safeArray(data.sboms).length, status: linkStatus(firstRecord(data.sboms)), reference: joinRecordIDs(data.sboms) },
        { family: "Vulnerability scan", count: safeArray(data.vulnerability_scans).length, status: linkStatus(firstRecord(data.vulnerability_scans)), reference: joinRecordIDs(data.vulnerability_scans) },
        { family: "VEX", count: safeArray(data.vex_documents).length, status: linkStatus(firstRecord(data.vex_documents)), reference: joinRecordIDs(data.vex_documents) },
        { family: "Vulnerability decision", count: safeArray(data.vulnerability_decisions).length, status: linkStatus(firstRecord(data.vulnerability_decisions)), reference: joinRecordIDs(data.vulnerability_decisions) },
        { family: "Release bundle", count: releaseBundles.length, status: releaseBundles.length ? "linked" : "missing", reference: joinRecordIDs(releaseBundles) }
      ], "No evidence link metadata is present.");

      appendText(nodes.proof, "h3", "", "Package Verification Result");
      table(nodes.proof, [
        { label: "Check", value: "check" },
        { label: "Result", value: "result", badge: true },
        { label: "Detail", value: "detail" }
      ], [
        { check: "Browser package view", result: "read_only", detail: "The viewer renders package-scoped JSON but does not verify package bytes." },
        { check: "CLI package verifier", result: material.hash_algorithm ? "available" : "missing", detail: "Run evydence package verify against the manifest or ZIP archive." },
        { check: "Signed release bundle material", result: releaseBundles.length ? "present" : "missing", detail: joinRecordIDs(releaseBundles) },
        { check: "Audit-chain material", result: audit.result || "not present", detail: audit.head_hash || audit.latest_sequence || "not present" },
        { check: "Customer decision export", result: decisionExport.file ? "present" : "not present", detail: decisionExport.file || "not present" }
      ], "No package verification result metadata is present.");

      const proofNote = document.createElement("p");
      proofNote.className = "note";
      proofNote.textContent = "Signed release bundle material and manifest hashes support reproducible technical review. They are not legal compliance proof, certification, complete SBOM proof, authoritative scanner coverage, or a secure-release guarantee.";
      nodes.proof.append(proofNote);
    };

    const renderVerification = (data) => {
      const material = safeObject(data.verification_material);
      sectionHead(nodes.verification, "Verification Status", material.hash_algorithm || "not present");
      const releaseBundles = safeArray(material.release_bundles);
      const audit = safeObject(material.audit_chain);
      const grid = document.createElement("div");
      grid.className = "summary-grid";
      [
        ["Canonicalization", material.canonicalization],
        ["Release bundle hashes", releaseBundles.length],
        ["Audit chain", audit.result],
        ["Latest sequence", audit.latest_sequence],
        ["Head hash", audit.head_hash],
        ["Manifest hash field", material.manifest_hash_field]
      ].forEach(([label, value]) => {
        const card = document.createElement("section");
        card.className = "metric " + resultTone(value);
        appendText(card, "p", "label", label);
        appendText(card, "p", "value", value);
        grid.append(card);
      });
      nodes.verification.append(grid);
      table(nodes.verification, [
        { label: "Bundle", value: (row) => row.id || row.manifest_hash },
        { label: "State", value: "state", badge: true },
        { label: "Manifest hash", value: "manifest_hash" },
        { label: "Signature refs", value: (row) => safeArray(row.signature_refs).join(", ") }
      ], releaseBundles, "No release bundle verification material is present.");
    };

    const renderLimitations = (data) => {
      sectionHead(nodes.limitations, "Non-Claims And Limitations");
      const split = document.createElement("div");
      split.className = "split";
      const limitations = document.createElement("div");
      appendText(limitations, "h3", "", "Limitations");
      tagList(limitations, data.limitations);
      const nonClaims = document.createElement("div");
      appendText(nonClaims, "h3", "", "Non-claims");
      tagList(nonClaims, data.non_claims);
      split.append(limitations, nonClaims);
      nodes.limitations.append(split);
    };

    const renderRaw = (parsed) => {
      sectionHead(nodes.raw, "Raw JSON");
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(parsed, null, 2);
      nodes.raw.append(pre);
    };

    const renderPackage = (parsed, fileName) => {
      const data = normalizeData(parsed);
      if (!data || typeof data !== "object") {
        throw new Error("JSON document is not an object");
      }
      renderSummary(data, fileName);
      renderDossier(data);
      renderRelease(data);
      renderArtifactsAndSBOM(data);
      renderRisk(data);
      renderApprovals(data);
      renderReadiness(data);
      renderContents(data);
      renderProof(data);
      renderVerification(data);
      renderLimitations(data);
      renderRaw(parsed);
      statusNode.textContent = "Loaded locally";
    };

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        return;
      }
      try {
        renderPackage(JSON.parse(await file.text()), file.name);
      } catch (error) {
        statusNode.textContent = "Could not parse JSON";
        summaryNode.replaceChildren();
        Object.values(nodes).forEach(clearNode);
        appendText(nodes.raw, "pre", "", String(error));
      }
    });

    demoButton.addEventListener("click", () => {
      renderPackage(bundledDemo, "bundled-demo-customer-package.json");
    });

    renderPackage(bundledDemo, "bundled-demo-customer-package.json");
  </script>
</body>
</html>
