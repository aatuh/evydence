schema_version: evydence-airgap-package.v1.0.0
images:
  - name: evydence
    repository: ghcr.io/aatuh/evydence
    tag: v0.1.0-rc.4
    required: true
bundled_paths:
  - migrations/
  - openapi.yaml
  - deploy/helm/evydence/
  - docs/air-gapped.md
verification:
  checksums: SHA256SUMS
  signature: SHA256SUMS.sig.json
limitations:
  - Project-owned release-candidate images are published through the maintainer Container Image workflow when run for the tag. Operators must verify and pin the image digest, or build, sign, and transfer actual images and archives through their controlled process.
