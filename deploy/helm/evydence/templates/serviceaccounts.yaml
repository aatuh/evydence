{{- include "evydence.validateSecretSeparation" . -}}
{{- range $component := list "api" "worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "evydence.runtimeServiceAccountName" (dict "root" $ "component" $component) }}
  labels:
    app.kubernetes.io/name: {{ include "evydence.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  {{- with (index $.Values $component).serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
