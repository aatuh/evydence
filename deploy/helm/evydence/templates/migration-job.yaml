{{- $image := include "evydence.image" . -}}
{{- $target := required "migration.target is required for an explicitly reviewed release" .Values.migration.target -}}
{{- $runtimeRole := .Values.migration.runtimeRole -}}
{{- if and $runtimeRole (or (gt (len $runtimeRole) 63) (eq (trim $runtimeRole) "")) -}}
{{- fail "migration.runtimeRole must be nonblank and at most 63 UTF-8 bytes when selected" -}}
{{- end -}}
{{- $fileSource := eq .Values.migration.secretSource "files" -}}
{{- if $fileSource -}}
{{- include "evydence.validateSecretFiles" (dict "root" . "process" .Values.migration) -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "evydence.migrationName" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    # Retain results until the next attempt or the TTL, for operator inspection.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ add (int64 .Values.migration.timeoutSeconds) (int64 .Values.cleanupTimeoutSeconds) 10 }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "evydence.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "evydence.migrationName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ add (int64 .Values.cleanupTimeoutSeconds) 5 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if $fileSource }}
      volumes:
        - name: migration-secret
          secret:
            secretName: {{ .Values.migration.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.env.databaseURLSecretKey | quote }}
                path: EVYDENCE_DATABASE_URL_FILE
      {{- end }}
      containers:
        - name: migrate
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["evydence-migrate"]
          securityContext:
            {{- $security := deepCopy .Values.containerSecurityContext -}}
            {{- $_ := set $security "readOnlyRootFilesystem" true -}}
            {{- toYaml $security | nindent 12 }}
          env:
            - name: ENV
              value: production
            - name: EVYDENCE_MIGRATIONS_DIR
              value: /app/migrations
            - name: EVYDENCE_MIGRATION_TARGET
              value: {{ $target | quote }}
            - name: EVYDENCE_MIGRATION_CHECKSUMS_FILE
              value: /app/migrations.sha256
            - name: EVYDENCE_MIGRATION_TIMEOUT_SECONDS
              value: {{ .Values.migration.timeoutSeconds | quote }}
            - name: EVYDENCE_MIGRATION_ALLOW_LEGACY_HISTORY
              value: {{ .Values.migration.allowLegacyHistory | quote }}
            {{- if $runtimeRole }}
            - name: EVYDENCE_MIGRATION_RUNTIME_ROLE
              value: {{ $runtimeRole | quote }}
            {{- end }}
            - name: EVYDENCE_SHUTDOWN_CLEANUP_TIMEOUT_SECONDS
              value: {{ .Values.cleanupTimeoutSeconds | quote }}
            {{- if $fileSource }}
            - name: EVYDENCE_DATABASE_URL_FILE
              value: /etc/evydence/private/EVYDENCE_DATABASE_URL_FILE
            {{- else }}
            - name: EVYDENCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.existingSecret | quote }}
                  key: {{ .Values.env.databaseURLSecretKey | quote }}
            {{- end }}
          {{- if $fileSource }}
          volumeMounts:
            - name: migration-secret
              mountPath: /etc/evydence/private
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
