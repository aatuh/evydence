{{- $imageTag := required "image.tag is required for Evydence release installs" .Values.image.tag -}}
{{- $fileSource := eq .Values.api.secretSource "files" -}}
{{- $files := include "evydence.secretFiles" (dict "root" . "process" .Values.api "name" "api") | fromYaml -}}
{{- if $fileSource -}}
{{- include "evydence.validateSecretFiles" (dict "root" . "process" .Values.api) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evydence.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  # A replacement cannot become ready until the old writer releases its lease.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "evydence.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "evydence.name" . }}
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: {{ include "evydence.terminationGrace" (dict "name" "api" "process" .Values.api "cleanup" .Values.cleanupTimeoutSeconds) }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: configuration-revision
          configMap:
            name: {{ include "evydence.fullname" . }}-config
            items:
              - key: EVYDENCE_CONFIGURATION_REVISION
                path: revision
        {{- if $fileSource }}
        - name: runtime-secrets
          secret:
            secretName: {{ include "evydence.runtimeSecret" (dict "process" .Values.api "fallback" .Values.existingSecret) }}
            defaultMode: 0440
            items:
              {{- range $option, $key := $files }}
              - key: {{ $key | quote }}
                path: {{ $option | quote }}
              {{- end }}
        {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["evydence-api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            {{- if .Values.api.environmentSecret }}
            - secretRef:
                name: {{ .Values.api.environmentSecret | quote }}
            {{- end }}
            {{- if not $fileSource }}
            - secretRef:
                name: {{ include "evydence.runtimeSecret" (dict "process" .Values.api "fallback" .Values.existingSecret) }}
            {{- end }}
            - configMapRef:
                name: {{ include "evydence.fullname" . }}-config
          env:
            - name: EVYDENCE_CONFIGURATION_REVISION_FILE
              value: /etc/evydence/config-revision/revision
            {{- if $fileSource }}
            {{- range $option, $key := $files }}
            - name: {{ $option }}
              value: {{ printf "/etc/evydence/private/%s" $option | quote }}
            {{- end }}
            {{- else }}
            - name: EVYDENCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "evydence.runtimeSecret" (dict "process" .Values.api "fallback" .Values.existingSecret) }}
                  key: {{ .Values.env.databaseURLSecretKey }}
            - name: EVYDENCE_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "evydence.runtimeSecret" (dict "process" .Values.api "fallback" .Values.existingSecret) }}
                  key: {{ .Values.env.apiKeyPepperSecretKey }}
            {{- end }}
          volumeMounts:
            - name: configuration-revision
              mountPath: /etc/evydence/config-revision
              readOnly: true
            {{- if $fileSource }}
            - name: runtime-secrets
              mountPath: /etc/evydence/private
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /v1/startup
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
