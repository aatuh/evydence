apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "evydence.migrationName" . }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    # Do not remove this account before the subsequent migration Job starts.
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
