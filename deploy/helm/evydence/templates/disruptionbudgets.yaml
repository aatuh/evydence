{{- range $component := list "api" "worker" }}
{{- if (index $.Values $component).disruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "evydence.runtimeServiceAccountName" (dict "root" $ "component" $component) }}
spec:
  {{- if eq $component "api" }}
  minAvailable: 1
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "evydence.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
