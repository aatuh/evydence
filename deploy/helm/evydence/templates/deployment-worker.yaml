{{- $imageTag := required "image.tag is required for Evydence release installs" .Values.image.tag -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evydence.fullname" . }}-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "evydence.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "evydence.name" . }}
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: {{ include "evydence.terminationGrace" (dict "name" "worker" "process" .Values.worker "cleanup" .Values.cleanupTimeoutSeconds) }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: configuration-revision
          configMap:
            name: {{ include "evydence.fullname" . }}-config
            items:
              - key: EVYDENCE_CONFIGURATION_REVISION
                path: revision
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["evydence-worker"]
          envFrom:
            - secretRef:
                name: {{ include "evydence.runtimeSecret" (dict "process" .Values.worker "fallback" .Values.existingSecret) }}
            - configMapRef:
                name: {{ include "evydence.fullname" . }}-config
          env:
            - name: EVYDENCE_CONFIGURATION_REVISION_FILE
              value: /etc/evydence/config-revision/revision
            - name: EVYDENCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "evydence.runtimeSecret" (dict "process" .Values.worker "fallback" .Values.existingSecret) }}
                  key: {{ .Values.env.databaseURLSecretKey }}
            - name: EVYDENCE_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "evydence.runtimeSecret" (dict "process" .Values.worker "fallback" .Values.existingSecret) }}
                  key: {{ .Values.env.apiKeyPepperSecretKey }}
          volumeMounts:
            - name: configuration-revision
              mountPath: /etc/evydence/config-revision
              readOnly: true
          {{- if .Values.worker.probes.enabled }}
          startupProbe:
            exec:
              command:
                {{- toYaml .Values.worker.probes.startupCommand | nindent 16 }}
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 60
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                {{- toYaml .Values.worker.probes.readinessCommand | nindent 16 }}
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            exec:
              command:
                {{- toYaml .Values.worker.probes.livenessCommand | nindent 16 }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
