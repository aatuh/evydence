image:
  repository: ghcr.io/aatuh/evydence
  # Release installs must set an explicit immutable tag or digest-style tag.
  # Local demos may override this with a local development tag.
  tag: ""
  pullPolicy: IfNotPresent

api:
  # Keep API replicas at 1 for the current production profile. Production API
  # startup also takes a PostgreSQL advisory writer lease and a second writer
  # fails closed until multi-writer concurrency controls are implemented and
  # documented.
  replicas: 1
  writerMode: single
  addr: ":8080"
  readHeaderTimeoutSeconds: 5
  readTimeoutSeconds: 30
  writeTimeoutSeconds: 60
  idleTimeoutSeconds: 120
  shutdownTimeoutSeconds: 30
  maxHeaderBytes: 16384
  maxURLBytes: 8192
  maxInFlightRequests: 256
  maxConcurrentUploads: 8
  rateLimitRequestsPerMinute: 120
  expensiveTenantRequestsPerMinute: 30
  rateLimitBucketCapacity: 10000
  # Set only to CIDRs of proxies that append and sanitize X-Forwarded-For.
  trustedProxyCIDRs: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

worker:
  replicas: 1
  pollInterval: 1s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  probes:
    enabled: true
    readinessCommand:
      - evydence-worker
      - healthcheck
    livenessCommand:
      - evydence-worker
      - healthcheck

env:
  production: true
  databaseURLSecretKey: EVYDENCE_DATABASE_URL
  apiKeyPepperSecretKey: EVYDENCE_API_KEY_PEPPER
  objectStore: s3
  s3Endpoint: ""
  s3Bucket: ""
  s3Region: ""
  s3UseSSL: "true"
  signingKeyMode: external

existingSecret: evydence-secrets

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: evydence.example.com
  tlsSecretName: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

networkPolicy:
  enabled: false
