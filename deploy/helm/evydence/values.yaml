image:
  repository: ghcr.io/aatuh/evydence
  # Production requires a digest, here or in tag@sha256 form. A local tag is
  # accepted only when env.production=false; it does not pin image contents.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Disk-backed disposable scratch; payloads remain in the configured object store.
scratchSizeMi: 128

# Shared resource cleanup budget after request/job drain.
cleanupTimeoutSeconds: 5

# Stop API and worker pods before an upgrade. The pre-upgrade hook cannot
# migrate while a runtime retains its shared schema lease.
migration:
  # Explicitly choose the target from the authenticated image's release catalog.
  target: ""
  timeoutSeconds: 120
  allowLegacyHistory: false
  # Optional existing dedicated runtime login. Requires a schema-owning migrator;
  # grants and operation audit commit before the hook releases its schema lock.
  runtimeRole: ""
  # Separate operator-provisioned database credential; no API/provider envFrom.
  existingSecret: evydence-migrations
  secretSource: env
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

api:
  serviceAccountAnnotations: {}
  # Distinct pre-provisioned credentials; production rejects shared references.
  existingSecret: evydence-api
  disruptionBudget:
    enabled: true
  # env preserves inline Secret variables; files projects private credentials.
  # files requires an explicit positive podSecurityContext.fsGroup.
  secretSource: env
  # Optional separate Secret for provider/native settings, before chart config.
  environmentSecret: ""
  # Additional file-option -> selected Secret key mappings. Database and API
  # pepper files use env.databaseURLSecretKey / env.apiKeyPepperSecretKey.
  secretFiles:
    EVYDENCE_S3_ACCESS_KEY_ID_FILE: EVYDENCE_S3_ACCESS_KEY_ID
    EVYDENCE_S3_SECRET_ACCESS_KEY_FILE: EVYDENCE_S3_SECRET_ACCESS_KEY
  # Keep API replicas at 1 for the current production profile. Production API
  # startup also takes a PostgreSQL advisory writer lease and a second writer
  # fails closed until multi-writer concurrency controls are implemented and
  # documented.
  replicas: 1
  writerMode: single
  addr: ":8080"
  readHeaderTimeoutSeconds: 5
  readTimeoutSeconds: 30
  writeTimeoutSeconds: 60
  idleTimeoutSeconds: 120
  shutdownTimeoutSeconds: 30
  # At least shutdownTimeoutSeconds + cleanupTimeoutSeconds + 5:
  # one second for optional trace cleanup and four seconds of scheduling margin.
  terminationGracePeriodSeconds: 40
  maxHeaderBytes: 16384
  maxURLBytes: 8192
  maxInFlightRequests: 256
  maxConcurrentUploads: 8
  rateLimitRequestsPerMinute: 120
  authenticationFailuresPerMinute: 20
  expensiveTenantRequestsPerMinute: 30
  rateLimitBucketCapacity: 10000
  # Set only to CIDRs of proxies that append and sanitize X-Forwarded-For.
  trustedProxyCIDRs: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 512Mi

worker:
  serviceAccountAnnotations: {}
  existingSecret: evydence-worker
  disruptionBudget:
    enabled: true
  secretSource: env
  environmentSecret: ""
  secretFiles:
    EVYDENCE_S3_ACCESS_KEY_ID_FILE: EVYDENCE_S3_ACCESS_KEY_ID
    EVYDENCE_S3_SECRET_ACCESS_KEY_FILE: EVYDENCE_S3_SECRET_ACCESS_KEY
  # Bound to 127.0.0.1 inside the pod; exec probes query this listener.
  healthPort: 8081
  replicas: 1
  pollInterval: 1s
  shutdownTimeoutSeconds: 30
  terminationGracePeriodSeconds: 40
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 512Mi
  probes:
    enabled: true
    startupCommand:
      - evydence-worker
      - healthcheck
      - --startup
    readinessCommand:
      - evydence-worker
      - healthcheck
    livenessCommand:
      - evydence-worker
      - healthcheck
      - --liveness

env:
  production: true
  databaseURLSecretKey: EVYDENCE_DATABASE_URL
  apiKeyPepperSecretKey: EVYDENCE_API_KEY_PEPPER
  objectStore: s3
  s3Endpoint: ""
  s3Bucket: ""
  s3Region: ""
  s3UseSSL: "true"
  signingKeyMode: external

# Legacy fallback for an explicitly empty daemon existingSecret. Production
# still requires distinct selected API, worker and migration Secret references.
existingSecret: evydence-secrets

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  host: evydence.example.com
  tlsSecretName: ""

podSecurityContext:
  runAsNonRoot: true
  # Numeric IDs let Kubernetes enforce non-root even with a named image USER.
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

networkPolicy:
  enabled: true
  # Empty allowlists deny application traffic until the operator supplies peers.
  apiIngressFrom: []
  # Adapt for the cluster's DNS pods or node-local resolver before installation.
  dnsPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  # Rules require both nonempty to and ports. Include database/storage for each
  # daemon, API signing/provider access, and any configured telemetry gateways.
  apiEgress: []
  workerEgress: []
  migrationEgress: []
