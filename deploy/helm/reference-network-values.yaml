# Reviewed operator input is required. Replace these documentation-only IPs,
# namespaces, labels and ports with the actual network peers before installing.
networkPolicy:
  apiIngressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
  migrationEgress:
    - &database
      to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 5432
  apiEgress:
    - *database
    - &objects
      to:
        - ipBlock:
            cidr: 198.51.100.20/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: evydence-signing
          podSelector:
            matchLabels:
              app: signing-gateway
      ports:
        - protocol: TCP
          port: 8443
  workerEgress:
    - *database
    - *objects
