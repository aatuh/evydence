name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, for example v0.1.0"
        required: true
        type: string
      upload_draft_release:
        description: "Create or update a draft GitHub release with the generated artifacts"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Package Signed Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: evydence
          POSTGRES_USER: evydence
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evydence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVYDENCE_API_KEY_PEPPER: ci-test-pepper
      EVYDENCE_TEST_DATABASE_URL: postgres://evydence:change-me@localhost:5432/evydence?sslmode=disable
      EVYDENCE_RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.EVYDENCE_RELEASE_SIGNING_PRIVATE_KEY_B64 }}
      EVYDENCE_RELEASE_ALLOW_EXISTING_TAG: ${{ github.ref_type == 'tag' && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+(\.[0-9]+){1,2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 2
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install QA tools
        run: make tools

      - name: Require release signing secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EVYDENCE_RELEASE_SIGNING_PRIVATE_KEY_B64}" ]]; then
            echo "EVYDENCE_RELEASE_SIGNING_PRIVATE_KEY_B64 secret is required to sign release artifacts" >&2
            exit 2
          fi

      - name: Package signed release candidate
        shell: bash
        run: |
          set -euo pipefail
          # scripts/release_candidate_package.sh runs make production-check before artifact packaging.
          # The generated dist/<tag>/ evidence set includes evydence-release-manifest.sig.json
          # plus a Scorecard-compatible evydence-release-manifest.sig alias.
          scripts/release_candidate_package.sh "${{ steps.release.outputs.tag }}"

      - name: Upload packaged release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evydence-release-artifacts-${{ steps.release.outputs.tag }}
          path: dist/${{ steps.release.outputs.tag }}/
          if-no-files-found: error

  publish-draft-release:
    name: Publish Draft GitHub Release
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' || github.event.inputs.upload_draft_release == 'true'
    permissions:
      contents: read
    steps:
      - name: Download packaged release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evydence-release-artifacts-${{ needs.package.outputs.tag }}
          path: dist/${{ needs.package.outputs.tag }}/

      - name: Require release publishing token
        env:
          EVYDENCE_RELEASE_PUBLISH_TOKEN: ${{ secrets.EVYDENCE_RELEASE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EVYDENCE_RELEASE_PUBLISH_TOKEN}" ]]; then
            echo "EVYDENCE_RELEASE_PUBLISH_TOKEN secret is required to create or update draft GitHub releases" >&2
            exit 2
          fi

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.EVYDENCE_RELEASE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.package.outputs.tag }}"
          repo="${GITHUB_REPOSITORY:?}"
          if gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/${tag}/* --repo "${repo}" --clobber
          else
            gh release create "${tag}" dist/${tag}/* --repo "${repo}" --draft --title "Evydence ${tag}" --notes-file "dist/${tag}/release-notes.md"
          fi
