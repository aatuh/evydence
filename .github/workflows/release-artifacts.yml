name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing protected RC tag pointing at this master commit"
        required: true
        type: string
      upload_draft_release:
        description: "Create or update a draft GitHub release with the generated artifacts"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check-release-notes:
    name: Check Committed Release Notes
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate committed notes before builds and environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py --tag "$RELEASE_TAG" check
          python3 scripts/release_notes.py --tag "$RELEASE_TAG" emit > "$RUNNER_TEMP/release-notes.md"
      - name: Retain concrete notes for release review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-source-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  verify-reproducible-builds:
    needs: [check-release-notes]
    uses: ./.github/workflows/reproducible-builds.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

  package:
    name: Package Signed Release Artifacts
    needs: verify-reproducible-builds
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected && github.event_name == 'workflow_dispatch' }}
    environment: release-production
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: evydence
          POSTGRES_USER: evydence
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evydence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVYDENCE_API_KEY_PEPPER: ci-test-pepper
      EVYDENCE_TEST_DATABASE_URL: postgres://evydence:change-me@localhost:5432/evydence?sslmode=disable
      EVYDENCE_TEST_S3_ENDPOINT: 127.0.0.1:9000
      EVYDENCE_TEST_S3_ACCESS_KEY_ID: evydence
      EVYDENCE_TEST_S3_SECRET_ACCESS_KEY: change-me-change-me
      EVYDENCE_TEST_S3_USE_SSL: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "release tag must look like v1.2.3-rc.1" >&2
            exit 2
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse --verify HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Enforce protected release source and approval policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python3 scripts/release_signing.py preflight --kind release --expected-commit "$GITHUB_SHA" --tag "$RELEASE_TAG"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install QA tools
        run: make tools

      - name: Install system tools and pinned Python QA wheels
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ripgrep python3-venv
          qa_venv="$RUNNER_TEMP/evydence-python-qa"
          python3 -m venv "$qa_venv"
          "$qa_venv/bin/python" -m pip --isolated --disable-pip-version-check install \
            --require-hashes --only-binary=:all: -r tools/requirements-qa.txt
          printf '%s\n' "$qa_venv/bin" >> "$GITHUB_PATH"

      - name: Install pinned Helm rendering tool
        env:
          HELM_VERSION: v4.3.0
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/evydence-helm"
          archive="$tool_dir/helm.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --silent --show-error "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$tool_dir" linux-amd64/helm
          "$tool_dir/linux-amd64/helm" version --short | grep --fixed-strings "$HELM_VERSION"
          echo "HELM_BIN=$tool_dir/linux-amd64/helm" >> "$GITHUB_ENV"

      - name: Install pinned OpenAPI diff tool
        env:
          OASDIFF_VERSION: 1.29.1
          OASDIFF_SHA256: 541f7c66c933495fceef24eaf5c48aa66c19069f366f7bd0a60a6a4820c5e533
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/oasdiff"
          archive="$tool_dir/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --silent --show-error "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$OASDIFF_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$tool_dir"
          "$tool_dir/oasdiff" --version | grep --fixed-strings "oasdiff version ${OASDIFF_VERSION}"
          echo "OASDIFF_BIN=$tool_dir/oasdiff" >> "$GITHUB_ENV"

      - name: Install pinned release evidence tools
        shell: bash
        run: |
          set -euo pipefail
          syft="$(make --silent --no-print-directory release-evidence-tools RELEASE_EVIDENCE_TOOLS_ROOT="${RUNNER_TEMP}/evydence-release-tools")"
          echo "EVYDENCE_RELEASE_SYFT=${syft}" >> "$GITHUB_ENV"

      - name: Start isolated MinIO integration service
        run: |
          set -euo pipefail
          make local-minio-image
          docker run --detach --name evydence-release-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=evydence --env MINIO_ROOT_PASSWORD=change-me-change-me \
            evydence-local-minio:20251015-9e49d5e7a648 server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Package signed release candidate
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          release_scanner="$EVYDENCE_RELEASE_SYFT"
          label_reader_token="$GH_TOKEN"
          export -n release_scanner
          export -n label_reader_token
          unset EVYDENCE_RELEASE_SYFT GH_TOKEN
          keydir="$(mktemp -d "${RUNNER_TEMP}/evydence-manifest-key.XXXXXXXX")"
          trap 'unset manifest_key label_reader_token; rm -f -- "$keydir/private.key" "$keydir/public.key"; rmdir -- "$keydir"' EXIT
          go run ./cmd/evydence release keygen --private-out "$keydir/private.key" --public-out "$keydir/public.key" >/dev/null
          manifest_key="$(cat "$keydir/private.key")"
          export -n manifest_key
          # scripts/release_candidate_package.sh runs make production-check before artifact packaging.
          # The generated dist/<tag>/ evidence set includes evydence-release-manifest.sig.json
          # plus a Scorecard-compatible evydence-release-manifest.sig alias.
          GH_TOKEN="$label_reader_token" EVYDENCE_RELEASE_SYFT="$release_scanner" EVYDENCE_RELEASE_ALLOW_EXISTING_TAG=1 \
            EVYDENCE_RELEASE_SIGNING_PRIVATE_KEY_B64="$manifest_key" scripts/release_candidate_package.sh "$RELEASE_TAG"

      - name: Stop isolated MinIO integration service
        if: always()
        run: docker rm --force evydence-release-minio || true

      - name: Upload packaged release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evydence-release-artifacts-${{ steps.release.outputs.tag }}
          path: dist/${{ steps.release.outputs.tag }}/
          if-no-files-found: error

  attest-release:
    name: Attest Release Publisher Identity
    runs-on: ubuntu-latest
    needs: package
    if: ${{ github.ref == 'refs/heads/master' && github.ref_protected && github.event_name == 'workflow_dispatch' }}
    environment: release-production
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.package.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.package.outputs.commit }}
    steps:
      - name: Check out attested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.package.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce protected signing context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_signing.py preflight --kind release --expected-commit "$EXPECTED_COMMIT" --tag "$RELEASE_TAG"
      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evydence-release-artifacts-${{ needs.package.outputs.tag }}
          path: dist/${{ needs.package.outputs.tag }}/
      - name: Verify subjects and manifest files before attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py --tag "$RELEASE_TAG" check-artifact
          python3 scripts/release_evidence_verify.py --dist "dist/$RELEASE_TAG" --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
          python3 scripts/release_signing.py verify-files --dist "dist/$RELEASE_TAG"
      - name: Attest manifest and signature
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/dist/${{ needs.package.outputs.tag }}/evydence-release-manifest.json
            ${{ github.workspace }}/dist/${{ needs.package.outputs.tag }}/evydence-release-manifest.sig.json
      - name: Verify exact publisher identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          install -m 644 "$BUNDLE_PATH" "dist/$RELEASE_TAG/evydence-release-attestations.sigstore.json"
          python3 scripts/release_signing.py verify-public --dist "dist/$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
      - name: Upload attested release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evydence-release-attested-artifacts-${{ needs.package.outputs.tag }}
          path: dist/${{ needs.package.outputs.tag }}/
          if-no-files-found: error

  publish-draft-release:
    name: Publish Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [package, attest-release]
    if: ${{ github.event.inputs.upload_draft_release == 'true' && github.ref == 'refs/heads/master' && github.ref_protected }}
    environment: release-production
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out packaged source for subject verification
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.package.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected publication context
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.package.outputs.commit }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: python3 scripts/release_signing.py preflight --kind release --expected-commit "$EXPECTED_COMMIT" --tag "$RELEASE_TAG"

      - name: Download packaged release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evydence-release-attested-artifacts-${{ needs.package.outputs.tag }}
          path: dist/${{ needs.package.outputs.tag }}/

      - name: Verify packaged subjects before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.package.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py --tag "$RELEASE_TAG" check-artifact
          python3 scripts/release_evidence_verify.py --dist "dist/${RELEASE_TAG}" \
            --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"
          python3 scripts/release_signing.py verify-public --dist "dist/$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --expected-commit "$EXPECTED_COMMIT"

      - name: Require release publishing token
        env:
          EVYDENCE_RELEASE_PUBLISH_TOKEN: ${{ secrets.EVYDENCE_RELEASE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EVYDENCE_RELEASE_PUBLISH_TOKEN}" ]]; then
            echo "EVYDENCE_RELEASE_PUBLISH_TOKEN secret is required to create or update draft GitHub releases" >&2
            exit 2
          fi

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.EVYDENCE_RELEASE_PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.package.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo="${GITHUB_REPOSITORY:?}"
          actual="$(gh api "repos/${repo}/commits/${tag}" --jq .sha)"
          if [[ "$actual" != "$EXPECTED_COMMIT" ]]; then
            echo "release tag does not identify the packaged source commit" >&2
            exit 2
          fi
          if draft="$(gh release view "${tag}" --repo "${repo}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "refusing to mutate assets of a published release" >&2
              exit 2
            fi
            gh release upload "${tag}" dist/${tag}/* --repo "${repo}"
          else
            gh release create "${tag}" dist/${tag}/* --repo "${repo}" --draft --verify-tag --target "$EXPECTED_COMMIT" --title "Evydence ${tag}" --notes-file "dist/${tag}/release-notes.md"
          fi
