name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-compatibility:
    name: Go Compatibility (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        go: ['1.26.10', '1.27.3']
    env:
      # Pin the selected compiler; go.mod's preferred toolchain must not
      # silently upgrade the minimum-version compatibility run.
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up selected Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test complete package set with selected compiler
        run: |
          go version
          go test ./... -timeout=30m

  production-check:
    name: Production Check
    permissions:
      contents: read
      pull-requests: read
    # Keep native recovery clients on the PostgreSQL 16 fixture profile.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: evydence
          POSTGRES_USER: evydence
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evydence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Only this read token reaches the label reader; release credentials are
      # unavailable in ordinary pull_request CI, including forked contributions.
      GH_TOKEN: ${{ github.token }}
      EVYDENCE_CHANGELOG_PULL_REQUEST: ${{ github.event.pull_request.number }}
      EVYDENCE_API_KEY_PEPPER: ci-test-pepper
      EVYDENCE_TEST_DATABASE_URL: postgres://evydence:change-me@localhost:5432/evydence?sslmode=disable
      EVYDENCE_TEST_S3_ENDPOINT: 127.0.0.1:9000
      EVYDENCE_TEST_S3_ACCESS_KEY_ID: evydence
      EVYDENCE_TEST_S3_SECRET_ACCESS_KEY: change-me-change-me
      EVYDENCE_TEST_S3_USE_SSL: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Release-truth validation compares the current release tag and the
          # recorded source snapshot with HEAD, so CI needs their history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system tools and pinned Python QA wheels
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ripgrep python3-venv
          qa_venv="$RUNNER_TEMP/evydence-python-qa"
          python3 -m venv "$qa_venv"
          "$qa_venv/bin/python" -m pip --isolated --disable-pip-version-check install \
            --require-hashes --only-binary=:all: -r tools/requirements-qa.txt
          printf '%s\n' "$qa_venv/bin" >> "$GITHUB_PATH"

      - name: Select PostgreSQL 16 recovery clients
        run: |
          set -euo pipefail
          pg_client_dir=/usr/lib/postgresql/16/bin
          "$pg_client_dir/pg_dump" --version | grep -E '^pg_dump \(PostgreSQL\) 16\.'
          "$pg_client_dir/pg_restore" --version | grep -E '^pg_restore \(PostgreSQL\) 16\.'
          printf '%s\n' "$pg_client_dir" >> "$GITHUB_PATH"

      - name: Install pinned Helm rendering tool
        env:
          HELM_VERSION: v4.3.0
          HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
        run: |
          tool_dir="$RUNNER_TEMP/evydence-helm"
          archive="$tool_dir/helm.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --silent --show-error \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$tool_dir" linux-amd64/helm
          "$tool_dir/linux-amd64/helm" version --short | grep --fixed-strings "$HELM_VERSION"
          echo "HELM_BIN=$tool_dir/linux-amd64/helm" >> "$GITHUB_ENV"

      - name: Install pinned OpenAPI diff tool
        env:
          OASDIFF_VERSION: 1.29.1
          OASDIFF_SHA256: 541f7c66c933495fceef24eaf5c48aa66c19069f366f7bd0a60a6a4820c5e533
        run: |
          tool_dir="$RUNNER_TEMP/oasdiff"
          archive="$tool_dir/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$OASDIFF_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$tool_dir"
          "$tool_dir/oasdiff" --version | grep --fixed-strings "oasdiff version ${OASDIFF_VERSION}"

      - name: Enforce OpenAPI compatibility and deprecation policy
        env:
          OASDIFF_BIN: ${{ runner.temp }}/oasdiff/oasdiff
        run: make openapi-breaking-check

      - name: Validate API bootstrap configuration
        env:
          GOFLAGS: -p=1
        run: go test ./cmd/evydence-api -timeout=30m

      - name: Install Go QA tools
        run: make tools

      - name: Set up Node for offline observability validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install locked observability QA dependencies
        run: make observability-tools

      - name: Start isolated MinIO integration service
        run: |
          make local-minio-image
          docker run --detach --name evydence-ci-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=evydence \
            --env MINIO_ROOT_PASSWORD=change-me-change-me \
            evydence-local-minio:20251015-9e49d5e7a648 \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs evydence-ci-minio >&2 || true
          exit 1

      - name: Run production check with live PostgreSQL and MinIO
        run: make production-check

      - name: Stop isolated MinIO integration service
        if: always()
        run: docker rm --force evydence-ci-minio || true

      - name: Upload release evidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evydence-ci-evidence-${{ github.sha }}
          path: |
            coverage.out
            tmp/release-check-summary.txt
            tmp/production-benchmark/production-benchmark-summary.json
            tmp/production-benchmark/production-benchmark-summary.txt
            tmp/black-box-release-artifact/black-box-release-artifact-summary.json
            tmp/black-box-release-artifact/black-box-release-artifact-summary.txt
            tmp/black-box-release-artifact/release/evydence_linux_amd64/SHA256SUMS
            tmp/production-check/evydence-release-manifest.json
            tmp/production-check/evydence-release-manifest.sig.json
            tmp/integration-check/integration-summary.json
          if-no-files-found: ignore

  race-and-stress:
    name: Race and Stress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: evydence
          POSTGRES_USER: evydence
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evydence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVYDENCE_API_KEY_PEPPER: ci-test-pepper
      EVYDENCE_TEST_DATABASE_URL: postgres://evydence:change-me@localhost:5432/evydence?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Repeat deterministic contention cases under race
        run: make concurrency-stress-check
      - name: Upload exact-commit contention evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evydence-concurrency-evidence-${{ github.sha }}
          path: |
            tmp/concurrency-stress/summary.json
            tmp/concurrency-stress/events.jsonl
          if-no-files-found: error
