name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-check:
    name: Production Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: evydence
          POSTGRES_USER: evydence
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evydence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EVYDENCE_API_KEY_PEPPER: ci-test-pepper
      EVYDENCE_TEST_DATABASE_URL: postgres://evydence:change-me@localhost:5432/evydence?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Release-truth validation compares the current release tag and the
          # recorded source snapshot with HEAD, so CI needs their history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system QA tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install Go QA tools
        run: make tools

      - name: Install pinned OpenAPI diff tool
        env:
          OASDIFF_VERSION: 1.29.1
          OASDIFF_SHA256: 541f7c66c933495fceef24eaf5c48aa66c19069f366f7bd0a60a6a4820c5e533
        run: |
          tool_dir="$RUNNER_TEMP/oasdiff"
          archive="$tool_dir/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$OASDIFF_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$tool_dir"
          "$tool_dir/oasdiff" --version | grep --fixed-strings "oasdiff version ${OASDIFF_VERSION}"

      - name: Enforce OpenAPI compatibility and deprecation policy
        env:
          OASDIFF_BIN: ${{ runner.temp }}/oasdiff/oasdiff
        run: make openapi-breaking-check

      - name: Run storage reconciliation focused tests
        run: go test ./internal/app ./internal/adapters/objectstore/... ./internal/adapters/postgres -count=1

      - name: Run production check with live PostgreSQL
        run: make production-check

      - name: Upload release evidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evydence-ci-evidence
          path: |
            coverage.out
            tmp/release-check-summary.txt
            tmp/production-benchmark/production-benchmark-summary.json
            tmp/production-benchmark/production-benchmark-summary.txt
            tmp/black-box-release-artifact/black-box-release-artifact-summary.json
            tmp/black-box-release-artifact/black-box-release-artifact-summary.txt
            tmp/black-box-release-artifact/release/evydence_linux_amd64/SHA256SUMS
            tmp/production-check/evydence-release-manifest.json
            tmp/production-check/evydence-release-manifest.sig.json
          if-no-files-found: ignore
