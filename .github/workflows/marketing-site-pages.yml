name: Marketing Site Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/marketing-site-pages.yml"
      - "site/marketing/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-site-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Marketing Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    env:
      PUBLIC_SITE_URL: https://evydence.app
      PUBLIC_SITE_BASE: /
      PUBLIC_GA_MEASUREMENT_ID: G-XC2ESEHQ3W
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/marketing/package-lock.json

      - name: Install marketing-site dependencies
        run: npm ci --prefix site/marketing

      - name: Build and validate marketing site
        run: make marketing-site-production-check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/marketing/dist

  deploy:
    name: Deploy Marketing Site
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
