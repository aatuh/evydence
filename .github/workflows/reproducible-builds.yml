name: Reproducible Builds

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate version used for unsigned comparison builds
        type: string
        default: v0.0.0-rc.0
  workflow_call:
    inputs:
      tag:
        description: Candidate version used for unsigned comparison builds
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Reproducible Build (${{ matrix.slot }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        slot: [first, second]
    env:
      REPRO_TAG: ${{ inputs.tag || 'v0.0.0-rc.0' }}
      REPRO_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select declared compiler without a shared build cache
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build unsigned complete payload set
        run: |
          export GOCACHE="$RUNNER_TEMP/repro-go-build-cache"
          python3 scripts/reproducible_build.py build \
            --tag "$REPRO_TAG" --expected-commit "$REPRO_COMMIT" \
            --bundle "$RUNNER_TEMP/repro-bundle"
      - name: Retain unsigned artifacts and digest inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-repro-${{ matrix.slot }}
          path: ${{ runner.temp }}/repro-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  compare:
    name: Reproducible Build Comparison
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPRO_TAG: ${{ inputs.tag || 'v0.0.0-rc.0' }}
      REPRO_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out comparison policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Fetch both job payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-repro-*
          path: ${{ runner.temp }}/repro-inputs
      - name: Require matching bytes and source identity
        run: |
          python3 scripts/reproducible_build.py compare \
            --tag "$REPRO_TAG" --expected-commit "$REPRO_COMMIT" \
            --first "$RUNNER_TEMP/repro-inputs/release-repro-first" \
            --second "$RUNNER_TEMP/repro-inputs/release-repro-second" \
            --output "$RUNNER_TEMP/reproducible-comparison.json"
      - name: Retain comparison and failure details
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-repro-comparison
          path: ${{ runner.temp }}/reproducible-comparison.json
          if-no-files-found: warn
          retention-days: 14
