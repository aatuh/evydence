name: Feature request
description: Propose a focused Evydence capability or integration.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What release-evidence, compliance-readiness, or operator workflow is blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful capability.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Trust boundary affected
      options:
        - API
        - Tenant isolation/authz
        - File upload/object storage
        - Signing/verification
        - Provider/collector integration
        - Reports/packages/exports
        - Deployment/operations
        - Documentation only
        - Other
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance test idea
      description: What command, API flow, or report would prove the feature works?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request supports compliance readiness or technical evidence organization without asking for legal compliance, certification, or secure-release guarantees.
          required: true
